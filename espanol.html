<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF9F0">
<title>西语 · 今日一课 · Charlotte</title>
<!--
  espanol 每日学习包页(清单式)。
  数据:data/espanol/days.json,按日期取当天;缺失时用内置样例兜底(file:// 下 fetch 不可用)。
  口语行:07 阶段仅显示任务 + 句子发音;跟读录音 / AI 对话由 09 接入。
-->
<style>
  :root{
    --paper:#FFF9F0; --card:#FFFFFF; --ink:#17171A;
    --es:#FF6B5E; --es-soft:#FFE3DF; --leaf:#7FB77E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--paper);
    background-image:radial-gradient(rgba(23,23,26,.14) 2px,transparent 2.2px);
    background-size:34px 34px;color:var(--ink);
    font-family:-apple-system,'PingFang SC','Noto Sans SC','Fredoka',sans-serif;
    -webkit-overflow-scrolling:touch;}
  body{min-height:100vh;}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 40px);}
  .brand{font-weight:800;letter-spacing:.5px;font-size:14px;opacity:.7;margin-bottom:8px;}
  .brand b{color:var(--es);}
  h1{font-size:28px;font-weight:800;line-height:1.25;margin-bottom:4px;}
  h1 .dot{color:var(--es);}
  .daytag{display:inline-block;font-weight:700;font-size:13px;border:2px solid var(--ink);
    border-radius:999px;padding:3px 14px;background:var(--es-soft);margin:8px 0 18px;}
  .sub{font-size:13px;color:var(--ink);opacity:.6;margin-bottom:16px;}

  .card{background:var(--card);border:3px solid var(--ink);border-radius:16px;
    box-shadow:5px 5px 0 var(--ink);padding:18px 16px;margin-bottom:18px;}

  /* 清单行 */
  .row{border:2px solid var(--ink);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden;}
  .row > .row-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;}
  .row .idx{flex:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--es-soft);}
  .row .rt{flex:1;font-weight:700;font-size:15px;}
  .row .rm{font-size:12px;opacity:.55;font-weight:600;font-family:'Fredoka',sans-serif;}
  .row .box{flex:none;width:22px;height:22px;border:2px solid var(--ink);border-radius:7px;background:var(--card);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;}
  .row .box.done{background:var(--leaf);}
  .note{color:var(--es);opacity:.75;font-size:11px;}
  .row .body{display:none;padding:0 14px 14px;border-top:2px dashed rgba(23,23,26,.2);}
  .row.open .body{display:block;padding-top:12px;}

  /* 词卡 */
  .word{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--ink);
    border-radius:12px;padding:9px 12px;margin-bottom:7px;background:var(--card);}
  .word .es{font-weight:800;font-size:16px;}
  .word .zh{font-size:12px;opacity:.6;margin-top:1px;}
  .word .play{flex:none;width:28px;height:28px;border:2px solid var(--ink);border-radius:999px;background:var(--es-soft);
    display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;font-weight:800;}
  .word .play:active{transform:scale(.92);}

  /* 脚本 / 阅读 */
  .samp{font-size:15px;line-height:1.9;}
  .samp li{list-style:none;padding:3px 0;}
  .samp li .sp{font-weight:700;}
  .samp li .zhs{font-size:12px;opacity:.55;margin-left:8px;}
  .reading{font-size:16px;line-height:1.9;padding:4px 0;}
  .playall{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:10px;
    padding:7px 14px;font-weight:800;font-size:13px;cursor:pointer;background:var(--es-soft);
    margin-bottom:10px;font-family:'Fredoka',-apple-system,sans-serif;}
  .playall:active{transform:translate(1px,1px);}
  textarea#writeBox{width:100%;border:2px solid var(--ink);border-radius:10px;padding:10px;font-size:14px;
    background:var(--card);font-family:inherit;resize:vertical;min-height:84px;}
  .write-actions{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .saved{font-size:12px;font-weight:700;color:var(--leaf);}
  .samp .say{margin-left:6px;cursor:pointer;font-size:13px;}

  /* 判断题 */
  .quiz{margin-top:12px;border-top:2px dashed rgba(23,23,26,.2);padding-top:10px;}
  .quiz .q{font-size:14px;font-weight:600;margin-bottom:6px;line-height:1.5;}
  .quiz .q .zhq{font-size:12px;opacity:.55;font-weight:400;margin-left:6px;}
  .quiz .opts{display:flex;gap:10px;}
  .quiz .opt{flex:1;border:2px solid var(--ink);border-radius:10px;padding:8px 0;text-align:center;
    font-weight:800;font-size:14px;cursor:pointer;background:var(--card);}
  .quiz .opt.correct{background:var(--leaf);}
  .quiz .opt.wrong{background:var(--es);}
  .quiz .fb{font-size:12px;margin-top:6px;opacity:.6;}

  .hint{font-size:12px;opacity:.55;line-height:1.7;margin-top:10px;}

  /* 打卡 */
  .checkin{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    border:3px solid var(--ink);border-radius:16px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;
    background:var(--es);box-shadow:5px 5px 0 var(--ink);font-family:'Fredoka',-apple-system,sans-serif;}
  .checkin:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .checkin.done{background:var(--leaf);}
  .state{font-size:12px;text-align:center;opacity:.6;margin-top:10px;font-weight:600;line-height:1.7;}

  .rest-card{text-align:center;padding:28px 18px;}
  .rest-card .big{font-size:22px;font-weight:800;margin-bottom:6px;}
  .rest-card .small{font-size:14px;opacity:.65;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
/* ============ 数据 ============ */
const FALLBACK_DAYS=[{
  date:'2026-08-17', day:1, weekday:'一', type:'listen', title:'精听 · 打招呼(样例)',
  duo:{topic:'基础问候 · Section 1 Unit 1',hint:'10 分钟,完成 1-2 课'},
  extras:[
    {es:'vale',zh:'好的(西班牙口语)',ex:'Vale, hasta luego.',note:'西班牙高频词'},
    {es:'vosotros',zh:'你们(西班牙专用)',ex:'¿Vosotros habláis español?',note:'西班牙:vosotros;拉美:ustedes'},
    {es:'coche',zh:'汽车',ex:'Mi coche es rojo.',note:'西班牙:coche;拉美:auto'}
  ],
  input:{kind:'listen',label:'精听 · 样例',script:[
    ['¡Hola! Me llamo Peppa.','你好,我叫佩奇。'],
    ['Esta es mi casa.','这是我的家。']
  ],hint:'同一段反复听,不看字幕能全听懂再换下一个。'},
  speaking:{kind:'shadow',label:'影子跟读',sentences:[
    ['¡Hola! Me llamo Marta.','你好,我叫玛尔塔。'],
    ['Mucho gusto.','很高兴认识你。']
  ]}
}];

let DAYS=null;
async function loadDays(){
  try{
    const r=await fetch('data/espanol/days.json?v='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(Array.isArray(j.days)&&j.days.length) return j.days;
    throw new Error('bad schema');
  }catch(e){ console.warn('days.json 读取失败,用内置样例:',e.message); return FALLBACK_DAYS; }
}

function todayISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ============ TTS(es-ES) ============ */
let VOICES=[];
if('speechSynthesis' in window){
  VOICES=speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged=()=>{ VOICES=speechSynthesis.getVoices(); };
}
function uttr(text){
  const u=new SpeechSynthesisUtterance(text); u.lang='es-ES'; u.rate=.9;
  const vs=VOICES.filter(v=>/^es(-|_)/i.test(v.lang));
  if(vs.length){ u.voice=vs.find(v=>/es-ES|es_ES/i.test(v.lang))||vs[0]; }
  return u;
}
function say(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(uttr(text));
}


/* ============ 打卡 ============ */
const CK_KEY='espanol.checkins';
function getCheckins(){ try{ return JSON.parse(localStorage.getItem(CK_KEY)||'[]'); }catch(e){ return []; } }
function isChecked(date){ return getCheckins().includes(date); }
function toggleCheckin(date){
  const c=getCheckins();
  const i=c.indexOf(date);
  if(i>=0) c.splice(i,1); else c.push(date);
  localStorage.setItem(CK_KEY,JSON.stringify(c));
}
/* 行完成记录(每日期 3 个:Duolingo/输入/口语) */
const ROWS_KEY='espanol.rows';
function getRows(date){
  try{ return JSON.parse(localStorage.getItem(ROWS_KEY)||'{}')[date]||[false,false,false]; }
  catch(e){ return [false,false,false]; }
}
function setRow(date,idx,val){
  const all=JSON.parse(localStorage.getItem(ROWS_KEY)||'{}');
  const r=getRows(date); r[idx]=val; all[date]=r;
  localStorage.setItem(ROWS_KEY,JSON.stringify(all));
}
/* 连续天数:从今天往回走,学习日(非 rest)必须已打卡,周末不中断 */
function calcStreak(days,idx){
  const c=getCheckins(); let s=0;
  for(let i=idx;i>=0;i--){
    const e=days[i]; if(!e) break;
    if(e.type==='rest') continue;
    if(c.includes(e.date)) s++; else break;
  }
  return s;
}
function calcLongest(days){
  const c=getCheckins(); let run=0,longest=0;
  for(const e of days){
    if(e.type==='rest') continue;
    if(c.includes(e.date)){ run++; longest=Math.max(longest,run); } else run=0;
  }
  return longest;
}

/* ============ 渲染 ============ */
const root=document.getElementById('root');
const WEEK=['日','一','二','三','四','五','六'];

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function wordList(words){
  return words.map(w=>`
    <div class="word">
      <div><div class="es">${esc(w.es)}</div><div class="zh">${esc(w.zh)}</div></div>
      <button class="play" onclick="say('${esc(w.es).replace(/'/g,"\\'")}')">🔊</button>
    </div>`).join('');
}
function scriptList(script){
  return `<ol class="samp">`+script.map(s=>`
    <li><span class="sp">${esc(s[0])}</span><span class="zhs">${esc(s[1])}</span>
    <span class="say" onclick="say('${esc(s[0]).replace(/'/g,"\\'")}')">🔊</span></li>`).join('')+`</ol>`;
}
function quizBlock(input){
  if(input.kind!=='read'||!input.questions) return '';
  return `<div class="quiz">`+input.questions.map((q,qi)=>`
    <div class="q">${esc(q.q)}<span class="zhq">${esc(q.zh)}</span></div>
    <div class="opts">
      <button class="opt" onclick="answer(${qi},true,this)">对</button>
      <button class="opt" onclick="answer(${qi},false,this)">错</button>
    </div>`).join('')+`</div>`;
}
function answer(qi,val,el){
  const qs=document.querySelectorAll('.quiz .q'); const q=qs[qi];
  if(!q||q.dataset.done==='1') return;
  q.dataset.done='1';
  const opts=q.nextElementSibling.querySelectorAll('.opt');
  opts.forEach(o=>o.onclick=null);
  const correct=(DAY.input&&DAY.input.questions)?DAY.input.questions[qi].a:null;
  opts[correct?0:1].classList.add('correct');
  if(val!==correct) el.classList.add('wrong');
}
/* 判断题的正确答案挂在渲染时注入 */
let DAY=null;

function extraList(extras){
  if(!extras||!extras.length) return '';
  return extras.map(w=>`
    <div class="word">
      <div><div class="es">${esc(w.es)}</div><div class="zh">${esc(w.zh)}${w.note?` <span class="note">· ${esc(w.note)}</span>`:''}</div></div>
      <button class="play" onclick="say('${esc(w.es).replace(/'/g,"\\'")}')">🔊</button>
    </div>`).join('');
}
function rowHead(idx,rows,date,title,min){
  return `<div class="row-head" onclick="this.parentNode.classList.toggle('open')">
    <span class="box ${rows[idx]?'done':''}" onclick="event.stopPropagation();rowDone('${date}',${idx},this)">${rows[idx]?'✓':''}</span>
    <span class="idx">${idx+1}</span><span class="rt">${title}</span><span class="rm">${min}</span></div>`;
}
function stateLine(date){
  const rows=getRows(date);
  return `补充词 ${rows[0]?'✓':'·'} · 输入 ${rows[1]?'✓':'·'} · 写作 ${rows[2]?'✓':'·'}`;
}
function renderStudy(day,idx){
  const streak=calcStreak(DAYS,idx), longest=calcLongest(DAYS), checked=isChecked(day.date);
  const rows=getRows(day.date);
  const dayName=day.weekday?('星期'+day.weekday):('');
  const typeTag=day.type==='listen'?'🎧 精听日':day.type==='read'?'📖 阅读日':'';
  const typeMin=day.type==='listen'||day.type==='read'?'10 min':'';

  let inputBody='';
  if(day.input){
    const src=day.input.source;
    if(src){
      inputBody+=src.type==='video'
        ? `<a class="playall" href="${esc(src.url||'')}" target="_blank" rel="noopener" style="text-decoration:none">🎬 真实语料 · ${esc(src.label||'')} ↗</a>`
        : `<div class="hint" style="margin:0 0 8px">📖 真实语料 · ${esc(src.label||'')}(手头有就读 1-2 页)</div>`;
    }
    if(day.input.kind==='listen') inputBody+=scriptList(day.input.script||[]);
    else if(day.input.kind==='read') inputBody+=`<button class="playall" onclick="say('${esc(day.input.text||'').replace(/'/g,"\\'")}')">🔊 听全文</button><p class="reading">${esc(day.input.text||'')}</p>`;
    inputBody+=quizBlock(day.input);
    if(day.input.hint) inputBody+=`<div class="hint">💡 ${esc(day.input.hint)}</div>`;
  }
  const extrasBody=(day.extras&&day.extras.length)
    ? `<div class="row">${rowHead(0,rows,day.date,'补充词 · 欧洲西语','快速过')}
        <div class="body">${extraList(day.extras)}</div></div>`
    : '';

  root.innerHTML=`
    <div class="brand">CHARLOTTE<span style="color:var(--es)">.</span> · ESPAÑOL</div>
    <h1>Día ${day.day||idx+1} · ${esc(day.title||'')}<span class="dot">.</span></h1>
    <div><span class="daytag">${typeTag||'西语'} · ${dayName}</span></div>
    <div class="sub">Duolingo 10-15 分钟在 app 里做(词汇/语法/口语)· 本页补它做不到的(约 15 分钟)</div>

    ${extrasBody}

    ${day.input?`<div class="row">${rowHead(1,rows,day.date,esc(day.input.label||'输入'),typeMin)}
      <div class="body">${inputBody}</div></div>`:''}

    ${day.writing?`<div class="row">${rowHead(2,rows,day.date,'写作 · 3 句','5 min')}
      <div class="body">
        <div class="hint" style="margin:0 0 8px">✍️ ${esc(day.writing.prompt||'')}</div>
        <textarea id="writeBox" rows="4" placeholder="用今天学的词写 3 句西语…">${esc(savedWriting(day.date))}</textarea>
        <div class="write-actions"><button class="playall" onclick="saveWriting('${day.date}')">💾 保存</button><span class="saved" id="writeState"></span></div>
      </div></div>`:''}

    <button class="checkin ${checked?'done':''}" onclick="doCheckin('${day.date}',this)">${checked?'✓ 今天已打卡':'完成今天的学习 → 打卡'}</button>
    <div class="state" id="stateLine">${stateLine(day.date)} · 当前连续 <b>${streak}</b> 天 · 历史最长 <b>${longest}</b> 天</div>`;
}
function updateStateLine(date){
  const el=document.getElementById('stateLine'); if(!el) return;
  const idx=DAYS.findIndex(d=>d.date===date);
  el.innerHTML=`${stateLine(date)} · 当前连续 <b>${calcStreak(DAYS,idx)}</b> 天 · 历史最长 <b>${calcLongest(DAYS)}</b> 天`;
}
function rowDone(date,idx,el){
  const r=getRows(date); const v=!r[idx]; setRow(date,idx,v);
  el.textContent=v?'✓':''; el.classList.toggle('done',v);
  updateStateLine(date);
}
function doCheckin(date,el){
  toggleCheckin(date);
  const now=isChecked(date);
  el.classList.toggle('done',now);
  el.textContent=now?'✓ 今天已打卡':'完成今天的学习 → 打卡';
  updateStateLine(date);
}

/* ===== 写作(每天 3 句,存 localStorage)===== */
const WR_KEY='espanol.writing';
function savedWriting(date){
  try{ return JSON.parse(localStorage.getItem(WR_KEY)||'{}')[date]||''; }catch(e){ return ''; }
}
function saveWriting(date){
  const box=document.getElementById('writeBox'); if(!box) return;
  const all=JSON.parse(localStorage.getItem(WR_KEY)||'{}');
  all[date]=box.value; localStorage.setItem(WR_KEY,JSON.stringify(all));
  const st=document.getElementById('writeState'); if(st) st.textContent='✓ 已保存';
}

/* ===== 周测(里程碑自测):最近 5 个学习日的补充词里抽 5 个 ===== */
function weekWords(){
  const t=todayISO(), list=[], seen={};
  for(let i=DAYS.length-1;i>=0;i--){
    const d=DAYS[i];
    if(d.date>t||d.type==='rest') continue;
    for(const w of (d.extras||[])){ if(!seen[w.es]){ seen[w.es]=1; list.push(w); } }
    if(list.length>=15) break;
  }
  return list;
}
let quizState=null;
function startQuiz(){
  const c=document.getElementById('quizBox'); if(!c) return;
  const words=weekWords();
  if(!words.length){ c.innerHTML='<div class="hint">本周还没有补充词,下周开始自测。</div>'; return; }
  quizState={pool:words.slice().sort(()=>Math.random()-.5).slice(0,5),i:0,right:0};
  renderQuiz();
}
function renderQuiz(){
  const c=document.getElementById('quizBox'); if(!c||!quizState) return;
  const {pool,i,right}=quizState;
  if(i>=pool.length){
    const pass=right>=pool.length-1;
    c.innerHTML=`<div class="hint" style="margin-top:6px">本周自测:<b>${right}/${pool.length}</b>${pass?' 🎉 通过,可以进下一单元。':' 有遗忘,去 vault 用间隔复习补一下。'}</div>`;
    return;
  }
  const w=pool[i];
  c.innerHTML=`
    <div class="quiz"><div class="q">${esc(w.es)}<span class="zhq">${esc(w.zh)}</span></div></div>
    <div class="hint" style="margin:4px 0 8px">先想中文 → 显示答案 → 自评</div>
    <div class="write-actions">
      <button class="playall" onclick="revealQuiz()">👁 显示答案</button>
      <button class="playall" onclick="quizNext(true)">✓ 记得</button>
      <button class="playall" onclick="quizNext(false)">✗ 忘了</button>
    </div>`;
}
function revealQuiz(){
  const c=document.getElementById('quizBox'); if(!c||!quizState) return;
  const w=quizState.pool[quizState.i];
  c.querySelector('.q').innerHTML=`${esc(w.es)} — ${esc(w.zh)} <span class="zhq">${esc(w.ex||'')}</span>`;
}
function quizNext(ok){
  if(!quizState) return;
  if(ok) quizState.right++;
  quizState.i++;
  renderQuiz();
}

function renderRest(day,next){
  root.innerHTML=`
    <div class="brand">CHARLOTTE<span style="color:var(--es)">.</span> · ESPAÑOL</div>
    <h1>${esc(day.title||'休息日')}<span class="dot">.</span></h1>
    <div><span class="daytag">🌿 休息 · ${day.weekday?'星期'+day.weekday:''}</span></div>
    <div class="card rest-card">
      <div class="big">今天没有新课</div>
      <div class="small">${next?`下一课:<b>${esc(next.title)}</b>(${next.weekday?'星期'+next.weekday:''})`:'这周课表到这就结束了,等下周的课吧。'}<br>也可以回头复习上周的词卡和句子,或在 vault 里过一遍间隔复习。</div>
    </div>
    <div class="card">
      <div style="font-weight:800;font-size:16px;margin-bottom:6px">📋 本周自测</div>
      <div class="hint" style="margin-bottom:8px">从本周补充词抽 5 个,先想中文再自评——连续通过 = 3 个月里程碑的一部分。</div>
      <div id="quizBox"></div>
    </div>`;
  startQuiz();
}
function renderEmpty(next){
  root.innerHTML=`
    <div class="brand">CHARLOTTE<span style="color:var(--es)">.</span> · ESPAÑOL</div>
    <h1>今天没有课<span class="dot">.</span></h1>
    <div class="card rest-card">
      <div class="small">${next?`下一课:<b>${esc(next.title)}</b>(${next.weekday?'星期'+next.weekday:''})`:'课表还没生成,先逛逛别的吧。'}</div>
    </div>`;
}

(async function init(){
  DAYS=await loadDays();
  const today=todayISO();
  const idx=DAYS.findIndex(d=>d.date===today);
  const next=DAYS.find(d=>d.date>today&&d.type!=='rest');
  if(idx>=0){
    DAY=DAYS[idx];
    if(DAY.type==='rest') renderRest(DAY,next);
    else renderStudy(DAY,idx);
  } else renderEmpty(next);
})();
</script>
</body>
</html>
