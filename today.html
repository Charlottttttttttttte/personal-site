<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF9F0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>今日事，今日毕 · Charlotte</title>
<style>
  :root{
    --paper:#FFF9F0; --card:#FFFFFF; --ink:#17171A;
    --pink:#FF87AB; --yellow:#FFD23F; --blue:#6FB1FF; --teal:#4ECDC4; --leaf:#7FB77E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--paper);background-image:radial-gradient(rgba(23,23,26,.14) 2px,transparent 2.2px);background-size:34px 34px;color:var(--ink);font-family:'Noto Sans SC',sans-serif;overscroll-behavior:auto;-webkit-overflow-scrolling:touch;}
  html{height:auto;}
  body{min-height:100vh;position:relative;}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 32px);}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .date{font-size:14px;color:var(--ink);opacity:.6;font-weight:600;}
  .brand{font-family:'Fredoka',sans-serif;font-size:15px;font-weight:700;}
  h1{font-family:'Fredoka',sans-serif;font-size:34px;font-weight:700;margin-bottom:4px;line-height:1.2;}
  h1 .dot{color:var(--pink);}
  .sub{font-size:14px;color:var(--ink);opacity:.6;margin-bottom:22px;}
  .card{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:20px 18px 16px;margin-bottom:18px;cursor:pointer;position:relative;overflow:hidden;display:block;text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease;}
  .card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);}
  .card::after{content:'';position:absolute;top:-18px;right:-18px;width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);}
  .card--labor::after{background:var(--yellow);}
  .card--ai::after{background:var(--blue);}
  .card--shufa::after{background:var(--teal);}
  .tag{display:inline-block;font-family:'Fredoka',sans-serif;font-weight:700;font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;margin-bottom:10px;}
  .card--labor .tag{background:var(--leaf);}
  .card--ai .tag{background:var(--blue);}
  .ctitle{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:700;margin-bottom:6px;}
  .cdesc{font-size:14px;line-height:1.6;opacity:.7;}
  .cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:11px;border-top:3px solid var(--ink);font-family:'Fredoka',sans-serif;font-size:12px;font-weight:600;}
  .carrow{font-size:18px;}
  .done{opacity:.55;}
  .done .tag{background:#D9D9D9;}
  .done .ctitle{text-decoration:line-through;}
  .hint{margin-top:6px;font-size:12px;color:var(--ink);opacity:.5;text-align:center;line-height:1.7;}
  /* 课程全屏查看器（iframe 嵌入，不跨站跳转） */
  #viewer{position:fixed;inset:0;background:var(--paper);z-index:100;display:none;flex-direction:column;}
  #viewer.open{display:flex;}
  .viewer-bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;
    background:var(--paper);border-bottom:2px solid var(--ink);}
  .viewer-back{font-family:'Fredoka',sans-serif;font-size:14px;font-weight:700;border:2px solid var(--ink);
    background:var(--card);border-radius:10px;padding:6px 14px;box-shadow:2px 2px 0 var(--ink);color:var(--ink);cursor:pointer;}
  .viewer-back:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
  .viewer-title{font-size:14px;font-weight:700;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #viewer iframe{flex:1;width:100%;border:0;background:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="brand">CHARLOTTE<span style="color:var(--pink)">.</span></span><span class="date" id="date"></span></header>
  <h1>今日事，今日毕<span class="dot">.</span></h1>
  <p class="sub" id="sub">每天打开，学今天该学的两门课。</p>

  <div class="card card--labor" id="laborCard" role="button" tabindex="0">
    <span class="tag" id="laborTag">⚖️ 劳动法</span>
    <div class="ctitle" id="laborTitle">—</div>
    <p class="cdesc" id="laborDesc"></p>
    <div class="cfoot"><span id="laborFoot">LABOR</span><span class="carrow">→</span></div>
  </div>

  <div class="card card--ai" id="aiCard" role="button" tabindex="0">
    <span class="tag" id="aiTag">🧠 AI</span>
    <div class="ctitle" id="aiTitle">—</div>
    <p class="cdesc" id="aiDesc"></p>
    <div class="cfoot"><span id="aiFoot">LEARNING PROJECT</span><span class="carrow">→</span></div>
  </div>

  <a class="card card--shufa" href="shufa-calendar.html" style="text-decoration:none;color:inherit;display:block;cursor:pointer;">
    <span class="tag" style="background:var(--teal);">🖌️ 书法</span>
    <div class="ctitle">临池录 · 书法打卡</div>
    <p class="cdesc">每日练习打卡 · 日历记录 · 纸张库存 · 长卷进度</p>
    <div class="cfoot"><span>CALLIGRAPHY</span><span class="carrow">→</span></div>
  </a>

  <p class="hint">每天 +1 天自动推进 · 点卡片开始学习</p>
</div>

<!-- 课程全屏查看器：iframe 嵌入课程，不跨站跳转 -->
<div id="viewer">
  <div class="viewer-bar">
    <button class="viewer-back" id="viewerBack">← 返回</button>
    <span class="viewer-title" id="viewerTitle"></span>
  </div>
  <iframe id="viewerFrame" src="about:blank" allow="microphone; autoplay"></iframe>
</div>

<script>
/* ===== 进度锚点（实际进度，非课表日期）=====
 * 劳动法：2026-10-07 学到 D5（当天），此后每天 +1
 * AI：2026-10-07 学到 D20（当天），此后每天 +1
 * 改进度只需改这两个锚点 */
const LABOR_ANCHOR_DATE = '2026-10-07';  // 锚点日期
const LABOR_ANCHOR_DAY  = 5;             // 锚点当天是劳动法 Day 5（2026-10-07 用户确认的实际进度）
const AI_ANCHOR_DATE = '2026-10-07';     // 锚点日期
const AI_ANCHOR_DAY  = 20;               // 锚点当天是 AI Day 20（2026-10-07 用户确认的实际进度）
const LABOR_MAX = 30, AI_MAX = 28;

/* ===== 劳动法课程表（D1–D30，打开劳动法学习卡讲义站）===== */
const LABOR = [
  {t:'劳动法管谁', d:'哪些人和关系归它管', url:'cards/labor-course/index.html?d=1'},
  {t:'不签合同', d:'不签？双倍工资', url:'cards/labor-course/index.html?d=2'},
  {t:'合同必备条款', d:'合同到手，先看这 9 条', url:'cards/labor-course/index.html?d=3'},
  {t:'试用期规则', d:'试用期不是随便试', url:'cards/labor-course/index.html?d=4'},
  {t:'竞业限制', d:'竞业限制？钱要给够', url:'cards/labor-course/index.html?d=5'},
  {t:'周复习', d:'W1 复习：合同那些事', url:'cards/labor-course/index.html?d=6'},
  {t:'最低工资', d:'低于最低标准？违法', url:'cards/labor-course/index.html?d=7'},
  {t:'加班费', d:'加班别白干，三档算清', url:'cards/labor-course/index.html?d=8'},
  {t:'工时制度', d:'你的工时属于哪种', url:'cards/labor-course/index.html?d=9'},
  {t:'拖欠工资', d:'欠薪？三步拿回', url:'cards/labor-course/index.html?d=10'},
  {t:'工资条扣款', d:'工资被扣？看红线', url:'cards/labor-course/index.html?d=11'},
  {t:'周复盘', d:'W2 复习：钱的事', url:'cards/labor-course/index.html?d=12'},
  {t:'带薪年假', d:'年假你有几天', url:'cards/labor-course/index.html?d=13'},
  {t:'病假医疗期', d:'生病了，公司不能乱开除', url:'cards/labor-course/index.html?d=14'},
  {t:'社保五险', d:'五险一金扣的是啥', url:'cards/labor-course/index.html?d=15'},
  {t:'公积金', d:'不是可缴可不缴', url:'cards/labor-course/index.html?d=16'},
  {t:'工伤认定', d:'出了工伤怎么办', url:'cards/labor-course/index.html?d=17'},
  {t:'周复习', d:'W3 复习：保障的事', url:'cards/labor-course/index.html?d=18'},
  {t:'调岗降薪', d:'能说调就调？', url:'cards/labor-course/index.html?d=19'},
  {t:'裁员补偿', d:'被裁员，N+1 怎么算', url:'cards/labor-course/index.html?d=20'},
  {t:'违法解除', d:'被违法辞退？拿 2N', url:'cards/labor-course/index.html?d=21'},
  {t:'劳动仲裁', d:'仲裁怎么走', url:'cards/labor-course/index.html?d=22'},
  {t:'维权证据', d:'维权要趁早，证据要留好', url:'cards/labor-course/index.html?d=23'},
  {t:'周复盘', d:'W4 复习：维权的事', url:'cards/labor-course/index.html?d=24'},
  {t:'辞职攻略', d:'辞职怎么提不踩坑', url:'cards/labor-course/index.html?d=25'},
  {t:'离职证明', d:'离职证明必须给', url:'cards/labor-course/index.html?d=26'},
  {t:'经济补偿金', d:'N 到底怎么算', url:'cards/labor-course/index.html?d=27'},
  {t:'职场红线', d:'这些红线别碰也别忍', url:'cards/labor-course/index.html?d=28'},
  {t:'维权工具箱', d:'打工人维权总表', url:'cards/labor-course/index.html?d=29'},
  {t:'结营复盘', d:'劳动法 30 天完结', url:'cards/labor-course/index.html?d=30'},
];

/* ===== AI 课程表（30天看懂AI，D1–D28，打开 AI 学习卡讲义站）===== */
const AI = [
  {t:'AI是接话机', d:'AI 只是特别会接话', url:'cards/ai-course/index.html?d=1'},
  {t:'词碎片', d:'AI 眼中的「词碎片」', url:'cards/ai-course/index.html?d=2'},
  {t:'AI会胡说', d:'AI 为什么胡说八道', url:'cards/ai-course/index.html?d=3'},
  {t:'记性短', d:'记性差？是窗口装不下', url:'cards/ai-course/index.html?d=4'},
  {t:'喂资料', d:'让 AI 开卷考试，别瞎编', url:'cards/ai-course/index.html?d=5'},
  {t:'三件套', d:'AI 答得烂？先看问题', url:'cards/ai-course/index.html?d=6'},
  {t:'第一周复盘', d:'一张图看懂 AI', url:'cards/ai-course/index.html?d=7'},
  {t:'注意力', d:'注意力机制一次看懂', url:'cards/ai-course/index.html?d=8'},
  {t:'温度', d:'脑洞开关：温度是什么', url:'cards/ai-course/index.html?d=9'},
  {t:'写代码比写作文强', d:'AI 写代码比写作文强', url:'cards/ai-course/index.html?d=10'},
  {t:'训练', d:'AI 变聪明：训练三阶段', url:'cards/ai-course/index.html?d=11'},
  {t:'思维链', d:'让 AI 想慢点：思维链', url:'cards/ai-course/index.html?d=12'},
  {t:'说不知道', d:'教 AI 说「不知道」', url:'cards/ai-course/index.html?d=13'},
  {t:'第二周复盘', d:'看懂 AI 内部', url:'cards/ai-course/index.html?d=14'},
  {t:'Agent循环', d:'Agent 循环一次看懂', url:'cards/ai-course/index.html?d=15'},
  {t:'MCP', d:'MCP：AI 的万能接口', url:'cards/ai-course/index.html?d=16'},
  {t:'我的AI助手', d:'我的 AI 助手在干嘛', url:'cards/ai-course/index.html?d=17'},
  {t:'记忆', d:'AI 转头就忘？记忆真相', url:'cards/ai-course/index.html?d=18'},
  {t:'个人知识库', d:'让 AI 记住你：关于我', url:'cards/ai-course/index.html?d=19'},
  {t:'多Agent', d:'一个 AI 不够？组队来凑', url:'cards/ai-course/index.html?d=20'},
  {t:'第三周复盘', d:'Agent 四件套复盘', url:'cards/ai-course/index.html?d=21'},
  {t:'AI会取代我吗', d:'取代你的是不会用 AI 的人', url:'cards/ai-course/index.html?d=22'},
  {t:'AI帮我做知识卡', d:'AI 帮我一天做张知识卡', url:'cards/ai-course/index.html?d=23'},
  {t:'提示注入', d:'AI 会被骗？提示注入', url:'cards/ai-course/index.html?d=24'},
  {t:'偏见', d:'AI 的偏见从哪来', url:'cards/ai-course/index.html?d=25'},
  {t:'普通人工作流', d:'普通人 AI 工作流清单', url:'cards/ai-course/index.html?d=26'},
  {t:'本地模型', d:'数据不出门？本地模型', url:'cards/ai-course/index.html?d=27'},
  {t:'结营', d:'30 天看懂 AI，完结', url:'cards/ai-course/index.html?d=28'},
];

/* ===== 计算今天 ===== */
function dayDiff(fromISO, toISO){
  const a=new Date(fromISO+'T00:00:00'), b=new Date(toISO+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function cur(d,max){ return Math.min(d,max); }

(function init(){
  const t=todayISO();
  const laborDiff=dayDiff(LABOR_ANCHOR_DATE,t);
  const laborDay=cur(LABOR_ANCHOR_DAY+laborDiff,LABOR_MAX);
  const aiDiff=dayDiff(AI_ANCHOR_DATE,t);
  const aiDay=cur(AI_ANCHOR_DAY+aiDiff,AI_MAX);

  document.getElementById('date').textContent=t;
  const l=LABOR[laborDay-1], a=AI[aiDay-1];

  document.getElementById('laborTag').textContent='⚖️ 劳动法 · D'+laborDay;
  document.getElementById('laborTitle').textContent=l.t;
  document.getElementById('laborDesc').textContent=l.d;
  document.getElementById('laborFoot').textContent='LABOR · '+laborDay+'/30';

  document.getElementById('aiTag').textContent='🧠 AI · D'+aiDay;
  document.getElementById('aiTitle').textContent=a.t;
  document.getElementById('aiDesc').textContent=a.d;
  document.getElementById('aiFoot').textContent='AI · '+aiDay+'/28';

  document.getElementById('sub').textContent='10/7 起劳动法 Day 5、AI Day 20，每天 +1 推进。';

  /* ===== 课程查看器：点击卡片在 iframe 内打开，不跨站跳转 ===== */
  const viewer=document.getElementById('viewer');
  const frame=document.getElementById('viewerFrame');
  const vTitle=document.getElementById('viewerTitle');

  function openViewer(url, title){
    vTitle.textContent=title;
    frame.src=url;
    viewer.classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeViewer(){
    viewer.classList.remove('open');
    frame.src='about:blank';
    document.body.style.overflow='';
  }
  document.getElementById('viewerBack').addEventListener('click', closeViewer);

  document.getElementById('laborCard').addEventListener('click', function(e){
    e.preventDefault();
    openViewer(l.url, '⚖️ 劳动法 · D'+laborDay+' '+l.t);
  });
  document.getElementById('aiCard').addEventListener('click', function(e){
    e.preventDefault();
    openViewer(a.url, '🧠 AI · D'+aiDay+' '+a.t);
  });
})();
</script>
</body>
</html>
