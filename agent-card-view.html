<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF9F0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>Agent 学习卡 · Charlotte</title>
<style>
  :root{
    --paper:#FFF9F0; --card:#FFFFFF; --ink:#17171A;
    --pink:#FF87AB; --yellow:#FFD23F; --blue:#6FB1FF; --teal:#4ECDC4;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--paper);background-image:radial-gradient(rgba(23,23,26,.14) 2px,transparent 2.2px);background-size:34px 34px;color:var(--ink);font-family:'Noto Sans SC',sans-serif;overscroll-behavior:auto;-webkit-overflow-scrolling:touch;}
  html{height:auto;}
  body{min-height:100vh;position:relative;}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 32px);}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .back{font-family:'Fredoka',sans-serif;font-size:15px;font-weight:700;border:3px solid var(--ink);background:var(--card);border-radius:12px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);text-decoration:none;transform:rotate(-1deg);}
  .stage-label{font-family:'Fredoka',sans-serif;font-size:15px;font-weight:700;background:var(--blue);border:3px solid var(--ink);border-radius:12px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink);transform:rotate(1deg);}
  h1{font-family:'Fredoka',sans-serif;font-size:28px;font-weight:700;margin-bottom:4px;}
  h1 .dot{color:var(--pink);}
  .sub{font-size:14px;color:var(--ink);opacity:.6;margin-bottom:16px;}
  .card-frame{background:var(--card);border:4px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:14px;margin-bottom:14px;cursor:zoom-in;}
  .card-frame img{display:block;width:auto;max-width:100%;height:auto;max-height:calc(100dvh - 250px);margin:0 auto;border-radius:10px;border:2px solid var(--ink);user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;touch-action:pan-y;}
  .tip{font-size:12px;color:var(--ink);opacity:.5;text-align:center;margin-bottom:16px;}
  /* 全屏放大查看 */
  #zoom{position:fixed;inset:0;background:rgba(18,18,20,.96);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;}
  #zoom.open{display:flex;}
  .zoom-head{width:100%;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;}
  .zoom-close{font-family:'Fredoka',sans-serif;font-size:15px;font-weight:700;border:3px solid #fff;background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:6px 16px;box-shadow:3px 3px 0 rgba(0,0,0,.4);}
  .zoom-close:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.4);}
  .zoom-stage{flex:1;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;display:flex;}
  .zoom-stage img{display:block;width:auto;height:auto;max-width:none;max-height:none;margin:auto;transform-origin:center;transition:transform .18s ease;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none;}
  .zoom-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.55);letter-spacing:1px;pointer-events:none;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;}
  .act{flex:1;min-width:150px;text-align:center;border:3px solid var(--ink);border-radius:14px;padding:13px 10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);box-shadow:4px 4px 0 var(--ink);transition:transform .15s ease,box-shadow .15s ease;}
  .act:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .act--wiki{background:var(--yellow);}
  .act--today{background:var(--card);}
  .act small{display:block;font-size:11px;opacity:.6;margin-top:2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="today.html">← 今日</a>
    <span class="stage-label" id="stageLabel">🤖 Agent · D1</span>
  </header>
  <h1>Agent 学习卡<span class="dot">.</span></h1>
  <p class="sub" id="sub">看今天的知识卡 · 每阶段更新内容</p>

  <div class="card-frame" id="cardFrame">
    <img src="img/agent-card.png" alt="Agent 学习卡片" id="cardImg">
  </div>
  <p class="tip" id="tip">👆 点卡片放大看细节 · 每阶段更新这张卡</p>

  <div class="actions">
    <a class="act act--wiki" id="wikiLink" href="#">📖 Wiki 概念页<small>想深入时再看</small></a>
    <a class="act act--today" href="today.html">🗓 今日学习<small>返回今天的课表</small></a>
  </div>
</div>

<!-- 全屏放大查看 -->
<div id="zoom" role="dialog" aria-label="卡片放大查看">
  <div class="zoom-head">
    <button class="zoom-close" id="zoomClose">✕ 关闭</button>
  </div>
  <div class="zoom-stage" id="zoomStage">
    <img src="" alt="卡片放大" id="zoomImg">
  </div>
  <p class="zoom-hint" id="zoomHint">双指缩放 · 拖动查看 · 点 ✕ 关闭</p>
</div>

<script>
/* 课表：D1-D28 → 标题 + Wiki 概念页（与 today.html 保持一致） */
const AGT = {
  1:{t:'Agent 循环', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FAgent-Loop'},
  2:{t:'MCP', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FMCP'},
  3:{t:'RAG', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FRAG'},
  4:{t:'Agent 记忆', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FAI-Agent-Memory'},
  5:{t:'Agent Skills', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FAgent-Skills'},
  6:{t:'复习日', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FAgent-Loop'},
  7:{t:'周复盘', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Findex'},
  8:{t:'Tool-Use 深入', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FTool-Use'},
  9:{t:'上下文工程', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FContext-Engineering'},
  10:{t:'Agent 编排', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FAgent-Orchestration'},
  11:{t:'子代理 Subagent', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Fsubagent'},
  12:{t:'复习日', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Findex'},
  13:{t:'周复盘', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Findex'},
  14:{t:'长期记忆方案', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FAI-Long-Term-Memory'},
  15:{t:'多 Agent 协作网络', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2F多Agent协作网络'},
  16:{t:'Prompt 工程', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Fprompt-engineering'},
  17:{t:'Meta-Prompt', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FMeta-Prompt'},
  18:{t:'复习日', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Findex'},
  19:{t:'周复盘', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Findex'},
  20:{t:'Agent 部署', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FAI-Agent-Deployment'},
  21:{t:'记忆分层', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FFour-Layer-Memory'},
  22:{t:'Skill 系统', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FSkill-System'},
  23:{t:'多 Agent 架构', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2FAI-Agent-Architecture'},
  24:{t:'复习日', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Findex'},
  25:{t:'周复盘', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Findex'},
  26:{t:'综合实战', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Findex'},
  27:{t:'答辩日', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Findex'},
  28:{t:'结营', w:'obsidian://open?vault=Charlotte&file=LLM-Wiki%2Fwiki%2Fconcepts%2Findex'},
};

(function init(){
  let day = 1;
  const m = location.search.match(/[?&]day=(\d+)/);
  if (m) day = Math.min(Math.max(+m[1],1),28);
  const cur = AGT[day] || AGT[1];
  document.getElementById('stageLabel').textContent = '🤖 Agent · D' + day;
  document.getElementById('sub').textContent = 'D' + day + ' · ' + cur.t + ' —— 每阶段更新这张卡';
  document.getElementById('tip').textContent = '👆 点卡片放大看细节 · D' + day + ' ' + cur.t;
  document.getElementById('wikiLink').href = cur.w;

  /* ===== 全屏放大查看 ===== */
  const zoom = document.getElementById('zoom');
  const stage = document.getElementById('zoomStage');
  const zimg = document.getElementById('zoomImg');
  const zClose = document.getElementById('zoomClose');
  const hi = 'cards/agent-card_1800x2400.png';  // 高清大图（页面小图 900×1200 的 2 倍版）
  let scale = 1, tx = 0, ty = 0;
  let pinch = null, drag = null;

  function apply(){
    zimg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  }
  function openZoom(){
    zimg.src = hi;
    zimg.onload = function(){ scale = 1; tx = 0; ty = 0; apply(); };
    zoom.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeZoom(){
    zoom.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('cardFrame').addEventListener('click', openZoom);
  zClose.addEventListener('click', closeZoom);
  zoom.addEventListener('click', function(e){ if(e.target === zoom) closeZoom(); });

  // 双指缩放
  stage.addEventListener('touchstart', function(e){
    if(e.touches.length === 2){
      pinch = { d: Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY), s: scale };
      drag = null;
    } else if(e.touches.length === 1){
      drag = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: tx, ty: ty };
      pinch = null;
    }
  }, {passive:true});
  stage.addEventListener('touchmove', function(e){
    if(pinch && e.touches.length === 2){
      const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      scale = Math.min(Math.max(pinch.s * d / pinch.d, 1), 4);
      apply();
      e.preventDefault();
    } else if(drag && e.touches.length === 1){
      tx = drag.tx + (e.touches[0].clientX - drag.x);
      ty = drag.ty + (e.touches[0].clientY - drag.y);
      apply();
      e.preventDefault();
    }
  }, {passive:false});
  stage.addEventListener('touchend', function(){ pinch = null; drag = null; }, {passive:true});

  // 桌面鼠标拖动
  stage.addEventListener('mousedown', function(e){
    drag = { x: e.clientX, y: e.clientY, tx: tx, ty: ty };
    e.preventDefault();
  });
  window.addEventListener('mousemove', function(e){
    if(drag && !pinch){ tx = drag.tx + (e.clientX - drag.x); ty = drag.ty + (e.clientY - drag.y); apply(); }
  });
  window.addEventListener('mouseup', function(){ drag = null; });

  // 滚轮缩放（桌面）
  stage.addEventListener('wheel', function(e){
    scale = Math.min(Math.max(scale - e.deltaY * .0012, 1), 4);
    apply();
    e.preventDefault();
  }, {passive:false});

  // 键盘 Esc 关闭
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeZoom(); });
})();
</script>
</body>
</html>
