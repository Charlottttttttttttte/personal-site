<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF7F2">
<link rel="icon" href="../../img/icon-192.png">
<title>炒股学习卡</title>
<style>
  :root{--paper:#FAF7F2;--primary:#2D3A8C;--accent:#E8613C;--ink:#1E1E1E;--gray:#8B8B8B;--soft:#C9CFEC;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:var(--paper);font-family:"PingFang SC",sans-serif;overscroll-behavior:none;}
  header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;z-index:20;background:linear-gradient(rgba(250,247,242,.95),rgba(250,247,242,0));}
  header > span:first-child{display:flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0;}
  .brand{font-size:13px;font-weight:700;color:var(--gray);white-space:nowrap;flex:0 0 auto;}
  .title{font-size:15px;font-weight:700;color:var(--primary);white-space:nowrap;flex:0 0 auto;}
  header > span:last-child{display:flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0;justify-content:flex-end;}
  .hbtn{flex:0 0 auto;font-size:13px;color:var(--gray);background:#fff;border:1px solid #ddd;border-radius:6px;padding:4px 9px;white-space:nowrap;}
  select{flex:0 1 auto;min-width:0;max-width:130px;font-size:12px;color:var(--primary);background:#fff;border:1px solid #ddd;border-radius:6px;padding:4px 5px;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #page{max-width:100vw;max-height:100vh;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .18s;}
  #page.loading{opacity:.35;}
  /* 嵌入 iframe 时（personal-site 今日页查看器）：卡片占满高度，裁掉左右多余留白，减少上下空白 */
  body.in-iframe{overflow:hidden;overflow-x:hidden;max-width:100vw;}
  body.in-iframe #stage{align-items:center;padding-top:0;overflow:hidden;}
  body.in-iframe #page{max-height:none;height:calc(100vh - env(safe-area-inset-top) - 56px);width:auto;max-width:100vw;object-fit:contain;}
  .zone{position:fixed;top:0;bottom:0;width:30%;z-index:10;}
  #prev{left:0;} #next{right:0;}
  #ind{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);right:16px;z-index:20;
    font-size:13px;color:var(--gray);letter-spacing:1px;text-align:right;pointer-events:none;}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--gray);font-size:15px;padding:40px;text-align:center;}
</style>
</head>
<body>
<header>
  <span>
    <span class="brand">📈 炒股学习卡</span>
    <span class="title" id="dtitle">D29</span>
  </span>
  <span>
    <button class="hbtn" id="todayBtn" onclick="goToday()">今日</button>
    <select id="picker" onchange="pinDay(+this.value)"></select>
  </span>
</header>
<div id="stage"><img id="page" alt=""></div>
<div class="zone" id="prev" onclick="nav(-1)"></div>
<div class="zone" id="next" onclick="nav(1)"></div>
<div id="ind">1 / 1</div>
<div id="err">课程内容加载失败，检查网络后刷新</div>
<script>
/* 检测是否嵌入 iframe（personal-site 今日页查看器场景），是则加 class 调整布局 */
try{ if(window.self!==window.top) document.body.classList.add('in-iframe'); }catch(e){}
let manifest=null, dayIdx=-1, seq=[], pos=0, touchX=0;
const img=document.getElementById('page');

async function boot(){
  try{
    const r=await fetch('manifest.json?'+Date.now());
    manifest=await r.json();
    const sel=document.getElementById('picker');
    manifest.days.forEach(d=>{
      const o=document.createElement('option');
      o.value=String(d.day); o.textContent='D'+d.day; o.title='D'+d.day+' · '+d.title;
      sel.appendChild(o);
    });
    goDay(resolveStartDay());
  }catch(e){ document.getElementById('err').style.display='flex'; }
}

/* ===== 今日进度 / 手动固定 ===== */
function courseStart(){
  try{ const s=localStorage.getItem('stock-start'); if(s) return new Date(s); }catch(e){}
  return new Date('2026-09-01T00:00:00');   // 炒股开课日 2026-09-01 = D37（可改 localStorage stock-start）
}
function expectedDay(){
  const start=courseStart();
  const today=new Date(); today.setHours(0,0,0,0);
  const elapsed=Math.floor((today-start)/86400000)+1;
  return Math.max(29, Math.min(56, 37+elapsed-1));   // D29 起，封顶 D56
}
function loadPin(){
  try{ const v=localStorage.getItem('stock-pin'); return v?parseInt(v,10):0; }catch(e){ return 0; }
}
function findDay(dayNum){                       // 复习日无卡时自动落到其后首张
  for(let i=0;i<manifest.days.length;i++) if(manifest.days[i].day>=dayNum) return i;
  return manifest.days.length-1;
}
function resolveStartDay(){
  // ?d=NN 深链优先（如 personal-site 今日页跳转，NN 为真实 Day 号 D29–D56）
  try{
    const m=location.search.match(/[?&]d=(\d+)/);
    if(m){
      const n=+m[1];
      if(n>=1 && n<=56) return findDay(n);
    }
  }catch(e){}
  const pin=loadPin();
  return pin ? findDay(pin) : findDay(expectedDay());   // 手动固定优先，否则按日期推进
}
function pinDay(dayNum){                      // 下拉手动选择：固定并记住
  try{ localStorage.setItem('stock-pin', String(dayNum)); }catch(e){}
  goDay(findDay(dayNum));
}
function goToday(){                           // 回到按日期推进的今日进度
  try{ localStorage.removeItem('stock-pin'); }catch(e){}
  goDay(findDay(expectedDay()));
}

async function goDay(i){
  dayIdx=i;
  document.getElementById('picker').value=manifest.days[dayIdx].day;
  const day=manifest.days[dayIdx];
  const imgs=[];
  for(let p=1;p<=day.pages;p++) imgs.push('page-'+String(p).padStart(2,'0')+'.png');
  seq=imgs.map(s=>({src:'days/'+day.dir+'/'+s}));
  pos=0; render();
  // 后台预加载当天全部图片，翻页时直接从缓存出图
  seq.forEach(it=>{ const im=new Image(); im.src=it.src; });
}

function nav(d){
  pos=Math.min(Math.max(pos+d,0),seq.length-1);
  render();
}

function render(){
  const item=seq[pos], day=manifest.days[dayIdx];
  document.getElementById('dtitle').textContent='D'+day.day;
  document.title='炒股学习卡 · D'+day.day+' '+day.title;
  document.getElementById('ind').textContent=(pos+1)+' / '+seq.length;
  if(img.getAttribute('src')!==item.src){
    img.classList.add('loading');
    img.onload=()=>img.classList.remove('loading');
    img.onerror=()=>img.classList.remove('loading');
    img.src=item.src;
  }
}

document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>50) nav(dx<0?1:-1);
},{passive:true});
boot();
</script>
</body>
</html>
