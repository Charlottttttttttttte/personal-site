<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Agent 循环 · 粗野主义</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:900px;height:1200px;overflow:hidden;font-family:"Noto Sans SC","PingFang SC",sans-serif;background:#F2EFE7;display:flex;align-items:center;justify-content:center;}
  .card{width:812px;height:1092px;background:#FFFEF9;border:5px solid #111;box-shadow:12px 12px 0 #111;display:flex;flex-direction:column;padding:52px 52px 46px;position:relative;}
  .brow{display:flex;justify-content:space-between;font-size:15px;font-weight:800;letter-spacing:2px;border:3px solid #111;padding:10px 16px;background:#FFDE59;transform:rotate(-1deg);}
  .brow .right{background:#111;color:#fff;padding:2px 12px;transform:rotate(2deg);}
  h1{font-size:130px;font-weight:900;line-height:.98;margin-top:30px;letter-spacing:2px;}
  .accent-badge{display:inline-block;background:#FF5D5D;border:3px solid #111;padding:6px 18px;font-size:20px;font-weight:900;margin-top:8px;transform:rotate(1.5deg);box-shadow:5px 5px 0 #111;}
  .lede{margin-top:26px;font-size:21px;line-height:1.8;font-weight:600;border-left:12px solid #111;padding-left:18px;}
  .lede b{background:#9BFF57;padding:0 6px;}
  .loop{margin-top:40px;display:flex;align-items:stretch;justify-content:space-between;gap:6px;}
  .step{flex:1;border:4px solid #111;background:#D6F5FF;padding:20px 10px;text-align:center;box-shadow:6px 6px 0 #111;}
  .step:nth-child(2){background:#FFDE59;}
  .step:nth-child(3){background:#FFB3C7;}
  .step .ic{font-size:44px;font-weight:900;display:block;}
  .step .lab{font-size:17px;font-weight:900;margin-top:14px;display:block;}
  .step .sub{font-size:12px;font-weight:700;color:#333;margin-top:6px;display:block;}
  .arr{flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;}
  .points{margin-top:36px;display:flex;flex-direction:column;gap:14px;}
  .pt{display:flex;gap:14px;align-items:center;border:3px solid #111;padding:14px 16px;background:#fff;box-shadow:5px 5px 0 #111;}
  .pt .n{flex:0 0 38px;height:38px;background:#111;color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .pt p{font-size:17px;font-weight:700;line-height:1.6;}
  .takeaway{margin-top:auto;background:#111;color:#fff;font-size:27px;font-weight:900;text-align:center;padding:22px 16px;letter-spacing:2px;transform:rotate(-.6deg);}
</style>
</head>
<body>
<div class="card">
  <div class="brow"><span>正在学 · AGENT 平台</span><span class="right">DAY 1</span></div>
  <h1>AGENT<br>循环</h1>
  <span class="accent-badge">所有 Agent 的共同内核</span>
  <p class="lede">反复执行：<b>调用模型 → 执行工具 → 回传结果</b>，消息数组越滚越长。</p>
  <div class="loop">
    <div class="step"><span class="ic">🧠</span><span class="lab">调用模型</span><span class="sub">决定下一步</span></div>
    <div class="arr">→</div>
    <div class="step"><span class="ic">🔧</span><span class="lab">执行工具</span><span class="sub">读写/调用</span></div>
    <div class="arr">→</div>
    <div class="step"><span class="ic">📨</span><span class="lab">回传结果</span><span class="sub">接回上下文</span></div>
    <div class="arr">↺</div>
  </div>
  <div class="points">
    <div class="pt"><div class="n">1</div><p>工具只是循环里的一步——纯聊天 ≠ Agent</p></div>
    <div class="pt"><div class="n">2</div><p>每步都基于完整历史，才能连续决策</p></div>
    <div class="pt"><div class="n">3</div><p>生产级再叠：权限 / 预算 / 生命周期</p></div>
  </div>
  <div class="takeaway">「能调工具、能接回结果，才配叫 Agent。」</div>
</div>
</body>
</html>
