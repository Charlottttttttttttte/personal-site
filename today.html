<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF9F0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>今日事，今日毕 · Charlotte</title>
<style>
  :root{
    --paper:#FFF9F0; --card:#FFFFFF; --ink:#17171A;
    --pink:#FF87AB; --yellow:#FFD23F; --blue:#6FB1FF; --teal:#4ECDC4; --leaf:#7FB77E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--paper);background-image:radial-gradient(rgba(23,23,26,.14) 2px,transparent 2.2px);background-size:34px 34px;color:var(--ink);font-family:'Noto Sans SC',sans-serif;overscroll-behavior:auto;-webkit-overflow-scrolling:touch;}
  html{height:auto;}
  body{min-height:100vh;position:relative;}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 32px);}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .date{font-size:14px;color:var(--ink);opacity:.6;font-weight:600;}
  .brand{font-family:'Fredoka',sans-serif;font-size:15px;font-weight:700;}
  h1{font-family:'Fredoka',sans-serif;font-size:34px;font-weight:700;margin-bottom:4px;line-height:1.2;}
  h1 .dot{color:var(--pink);}
  .sub{font-size:14px;color:var(--ink);opacity:.6;margin-bottom:22px;}
  .card{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:20px 18px 16px;margin-bottom:18px;cursor:pointer;position:relative;overflow:hidden;display:block;text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease;}
  .card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);}
  .card::after{content:'';position:absolute;top:-18px;right:-18px;width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);}
  .card--fin::after{background:var(--yellow);}
  .card--agent::after{background:var(--blue);}
  .card--shufa::after{background:var(--teal);}
  .tag{display:inline-block;font-family:'Fredoka',sans-serif;font-weight:700;font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;margin-bottom:10px;}
  .card--fin .tag{background:var(--pink);}
  .card--agent .tag{background:var(--blue);}
  .ctitle{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:700;margin-bottom:6px;}
  .cdesc{font-size:14px;line-height:1.6;opacity:.7;}
  .cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:11px;border-top:3px solid var(--ink);font-family:'Fredoka',sans-serif;font-size:12px;font-weight:600;}
  .carrow{font-size:18px;}
  .done{opacity:.55;}
  .done .tag{background:#D9D9D9;}
  .done .ctitle{text-decoration:line-through;}
  .hint{margin-top:6px;font-size:12px;color:var(--ink);opacity:.5;text-align:center;line-height:1.7;}
  /* 课程全屏查看器（iframe 嵌入，不跨站跳转） */
  #viewer{position:fixed;inset:0;background:var(--paper);z-index:100;display:none;flex-direction:column;}
  #viewer.open{display:flex;}
  .viewer-bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;
    background:var(--paper);border-bottom:2px solid var(--ink);}
  .viewer-back{font-family:'Fredoka',sans-serif;font-size:14px;font-weight:700;border:2px solid var(--ink);
    background:var(--card);border-radius:10px;padding:6px 14px;box-shadow:2px 2px 0 var(--ink);color:var(--ink);cursor:pointer;}
  .viewer-back:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
  .viewer-title{font-size:14px;font-weight:700;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #viewer iframe{flex:1;width:100%;border:0;background:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="brand">CHARLOTTE<span style="color:var(--pink)">.</span></span><span class="date" id="date"></span></header>
  <h1>今日事，今日毕<span class="dot">.</span></h1>
  <p class="sub" id="sub">每天打开，学今天该学的两门课。</p>

  <div class="card card--fin" id="finCard" role="button" tabindex="0">
    <span class="tag" id="finTag">📈 财经</span>
    <div class="ctitle" id="finTitle">—</div>
    <p class="cdesc" id="finDesc"></p>
    <div class="cfoot"><span id="finFoot">FINANCE</span><span class="carrow">→</span></div>
  </div>

  <div class="card card--agent" id="agentCard" role="button" tabindex="0">
    <span class="tag" id="agentTag">🤖 Agent</span>
    <div class="ctitle" id="agentTitle">—</div>
    <p class="cdesc" id="agentDesc"></p>
    <div class="cfoot"><span id="agentFoot">LEARNING PROJECT</span><span class="carrow">→</span></div>
  </div>

  <a class="card card--shufa" href="shufa-calendar.html" style="text-decoration:none;color:inherit;display:block;cursor:pointer;">
    <span class="tag" style="background:var(--teal);">🖌️ 书法</span>
    <div class="ctitle">临池录 · 书法打卡</div>
    <p class="cdesc">每日练习打卡 · 日历记录 · 纸张库存 · 长卷进度</p>
    <div class="cfoot"><span>CALLIGRAPHY</span><span class="carrow">→</span></div>
  </a>

  <p class="hint">每天 +1 天自动推进 · 点卡片开始学习</p>
</div>

<!-- 课程全屏查看器：iframe 嵌入课程，不跨站跳转 -->
<div id="viewer">
  <div class="viewer-bar">
    <button class="viewer-back" id="viewerBack">← 返回</button>
    <span class="viewer-title" id="viewerTitle"></span>
  </div>
  <iframe id="viewerFrame" src="about:blank"></iframe>
</div>

<script>
/* ===== 进度锚点（实际进度，非课表日期）=====
 * 财经：2026-08-10 学到 D15（当天），此后每天 +1
 * Agent：2026-08-10 开始第 1 期，此后每天 +1（18 期课程，来自 agent-knowledge-cards）
 * 改进度只需改这两个锚点 */
const FIN_ANCHOR_DATE = '2026-08-10';  // 锚点日期
const FIN_ANCHOR_DAY  = 15;            // 锚点当天是财经 D15
const AGT_ANCHOR_DATE = '2026-08-10';  // 锚点日期
const AGT_ANCHOR_DAY  = 1;             // 锚点当天是 Agent 第 1 期
const FIN_MAX = 28, AGT_MAX = 28;

/* ===== 课程表（标题 + 一句话描述 + 目标链接）===== */
const FIN = [
  {t:'三大报表', d:'资产负债表 / 利润表 / 现金流量表，各回答什么问题', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=1'},
  {t:'资产负债表', d:'资产 = 负债 + 所有者权益，恒等式怎么读', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=2'},
  {t:'利润表', d:'从营业收入到净利润的漏斗，层层扣减', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=3'},
  {t:'现金流量表', d:'经营 / 投资 / 筹资三股水流', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=4'},
  {t:'三表成网', d:'利润如何流进另外两张表，三表勾稽', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=5'},
  {t:'一周全景', d:'三大报表串起来看一家公司', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=6'},
  {t:'周复盘', d:'本周错题重考 + 速查表沉淀', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=7'},
  {t:'年报长什么样', d:'披露结构、巨潮下载、三节框架', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=8'},
  {t:'毛利率与净利率', d:'赚钱能力两层温度计', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=9'},
  {t:'杜邦三杠杆', d:'ROE 股东回报总开关', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=10'},
  {t:'风险体温计', d:'资产负债率与流动比率', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=11'},
  {t:'钱转多快', d:'周转率：存货与应收', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=12'},
  {t:'指标仪表盘', d:'W2 错题重考 + 指标串讲', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=13'},
  {t:'周复盘', d:'速查表沉淀 + W3 预告', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=14'},
  {t:'货币与央行', d:'央行是干什么的', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=15'},
  {t:'利率与 LPR', d:'降息加息如何传导到你我', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=16'},
  {t:'通胀与 CPI', d:'钱为什么毛了', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=17'},
  {t:'社融与 M2', d:'全社会的钱从哪来', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=18'},
  {t:'央行工具箱', d:'降准、逆回购、MLF', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=19'},
  {t:'宏观仪表盘', d:'W3 错题重考 + 用指标读一条新闻', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=20'},
  {t:'周复盘', d:'速查表沉淀 + W4 预告', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=21'},
  {t:'好公司三问', d:'生意模式 / 护城河 / 管理层', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=22'},
  {t:'读茅台 MD&A', d:'管理层讨论与分析实战', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=23'},
  {t:'算茅台五个指标', d:'财务指标体检下结论', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=24'},
  {t:'估值入门', d:'PE / PB 是什么，贵贱怎么看', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=25'},
  {t:'写 mini 公司分析', d:'模板填空完成你的分析', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=26'},
  {t:'答辩日', d:'模拟路演 + 验收三项检查', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=27'},
  {t:'结营', d:'总复盘 + 速查表定稿', url:'https://charlottttttttttttte.github.io/caijing-daily/?day=28'},
];
const AGT = [
  {t:'什么是 AI Agent', d:'模型+工具+编排层+运行时，in a loop 转圈', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=1'},
  {t:'Agent 四要素', d:'模型 / 工具 / 编排 / 部署，缺一不可', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=2'},
  {t:'五步循环 Think–Act–Observe', d:'先想、再做、看了结果再想，直到达成目标', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=3'},
  {t:'Agent 分级 Level 0-4', d:'从简单对话到自主多步，你处在哪一级', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=4'},
  {t:'上下文工程', d:'模型太万能，窗口里放什么才是关键', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=5'},
  {t:'模型选型与路由', d:'不同任务配不同模型，省成本又不掉链子', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=6'},
  {t:'RAG：先查资料再回答', d:'开卷考试，减少幻觉、补上时效性', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=7'},
  {t:'函数调用与 MCP', d:'OpenAPI 是说明书，MCP 是 USB-C 插座', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=8'},
  {t:'短期记忆 vs 长期记忆', d:'草稿本与档案柜——转头就忘 vs 越用越懂你', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=9'},
  {t:'多 Agent 四大设计模式', d:'分工、协作、编排——一个不够就组队', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=10'},
  {t:'Agent Ops：怎么评测 Agent', d:'把「好不好」变成「多少分」', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=11'},
  {t:'LM as Judge 大模型当考官', d:'让另一个模型打分，稳定又省人', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=12'},
  {t:'A2A：Agent 与 Agent 互联', d:'Agent 之间握手协作，像人加入组织', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=13'},
  {t:'提示注入与纵深防御', d:'模型会被骗，两层防护一起兜底', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=14'},
  {t:'Agent 身份（SPIFFE）', d:'每个 Agent 一张身份证，谁能信谁', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=15'},
  {t:'治理网关与 Agent 蔓延', d:'Agent 多了要管，别让它们失控', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=16'},
  {t:'Agent 怎么学习进化', d:'自动实验循环，越用越强', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=17'},
  {t:'实例：Co-Scientist / AlphaEvolve', d:'看看真正的 Agent 长什么样', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=18'},
  {t:'Agent Skills', d:'把 know-how 打包成可复用能力单元', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=19'},
  {t:'Tool-Use 深入', d:'模型怎么调用工具、从对话到行动', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=20'},
  {t:'子代理 Subagent', d:'并行分解任务：10 人干 1 天 > 1 人干 10 天', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=21'},
  {t:'长期记忆方案', d:'跨会话记住你：记录→压缩→回注', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=22'},
  {t:'Prompt 工程', d:'Zero-Shot / Few-Shot / 思维链，让模型听懂人话', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=23'},
  {t:'Meta-Prompt', d:'让 AI 自己写提示词，不懂术语也能用', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=24'},
  {t:'Agent 部署', d:'从开发到生产：延迟/成本/安全/可观测', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=25'},
  {t:'记忆分层', d:'core/memo/daily：按生命周期分层存', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=26'},
  {t:'Skill 系统', d:'SKILL.md 结构、仓库管理与渐进式加载', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=27'},
  {t:'多 Agent 架构', d:'生产级组队：规划/记忆/工具/执行模块化', url:'https://charlottttttttttttte.github.io/agent-knowledge-cards/?day=28'},
];

/* ===== 计算今天 ===== */
function dayDiff(fromISO, toISO){
  const a=new Date(fromISO+'T00:00:00'), b=new Date(toISO+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function cur(d,max){ return Math.min(d,max); }

(function init(){
  const t=todayISO();
  const diff=dayDiff(FIN_ANCHOR_DATE,t);
  const finDay=cur(FIN_ANCHOR_DAY+diff,FIN_MAX);
  const agtDay=cur(AGT_ANCHOR_DAY+diff,AGT_MAX);

  document.getElementById('date').textContent=t;
  const f=FIN[finDay-1], a=AGT[agtDay-1];

  document.getElementById('finTag').textContent='📈 财经 · D'+finDay;
  document.getElementById('finTitle').textContent=f.t;
  document.getElementById('finDesc').textContent=f.d;
  document.getElementById('finFoot').textContent='FINANCE · '+finDay+'/28';

  document.getElementById('agentTag').textContent='🤖 Agent · 第'+agtDay+'期';
  document.getElementById('agentTitle').textContent=a.t;
  document.getElementById('agentDesc').textContent=a.d;
  document.getElementById('agentFoot').textContent='AGENT · '+agtDay+'/28';

  document.getElementById('sub').textContent='8/10 起财经 D15、Agent 第 1 期，每天 +1 推进。';

  /* ===== 课程查看器：点击卡片在 iframe 内打开，不跨站跳转 ===== */
  const viewer=document.getElementById('viewer');
  const frame=document.getElementById('viewerFrame');
  const vTitle=document.getElementById('viewerTitle');

  function openViewer(url, title){
    vTitle.textContent=title;
    frame.src=url;
    viewer.classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeViewer(){
    viewer.classList.remove('open');
    frame.src='about:blank';
    document.body.style.overflow='';
  }
  document.getElementById('viewerBack').addEventListener('click', closeViewer);

  document.getElementById('finCard').addEventListener('click', function(e){
    e.preventDefault();
    openViewer(f.url, '📈 财经 · D'+finDay+' '+f.t);
  });
  document.getElementById('agentCard').addEventListener('click', function(e){
    e.preventDefault();
    openViewer(a.url, '🤖 Agent · 第'+agtDay+'期 '+a.t);
  });
})();
</script>
</body>
</html>
