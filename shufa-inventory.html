<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#FFF9F0" />
<title>临池录 · 纸张库存 · Charlotte</title>
<link rel="manifest" href="manifest-shufa.json" />
<link rel="apple-touch-icon" href="img/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* ============ 摩天轮风格 + 小程序同款库存交互 ============ */
  :root{
    --paper:#FFF9F0; --card:#FFFFFF; --ink:#17171A;
    --pink:#FF87AB; --yellow:#FFD23F; --blue:#6FB1FF; --teal:#4ECDC4; --leaf:#7FB77E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    background:var(--paper);
    background-image:radial-gradient(rgba(23,23,26,.14) 2px,transparent 2.2px);
    background-size:34px 34px;
    color:var(--ink);
    font-family:'Noto Sans SC',sans-serif;
    overscroll-behavior:auto;-webkit-overflow-scrolling:touch;
  }
  body{min-height:100vh;position:relative;padding-bottom:110px;}
  .fun{font-family:'Fredoka',sans-serif;font-variant-numeric:tabular-nums;}

  .site-header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;justify-content:space-between;align-items:center;
    padding:calc(env(safe-area-inset-top) + 12px) 6vw 12px;
    background:rgba(255,249,240,.92);backdrop-filter:blur(6px);
    border-bottom:3px solid var(--ink);
  }
  .brand{font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;color:var(--ink);text-decoration:none;}
  .brand b{color:var(--pink);}
  .site-nav{display:flex;gap:8px;}
  .site-nav a{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:12.5px;color:var(--ink);text-decoration:none;
    border:2px solid var(--ink);border-radius:999px;padding:2px 13px;background:var(--card);
    box-shadow:2px 2px 0 var(--ink);
  }

  .page{
    max-width:640px;margin:0 auto;
    padding:calc(env(safe-area-inset-top) + 86px) 5vw 40px;
  }
  .page-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;gap:6px;}
  .page-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.1;}
  .page-title .dot{color:var(--pink);}
  .sync-status{font-size:.8rem;font-weight:600;min-height:1.3em;margin-bottom:4px;opacity:.8;}
  .sync-status.ok{color:#2E7D5B;}
  .sync-status.err{color:#B33737;}

  /* ---------- 统计卡（小程序同款：3 项） ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  .stat{
    background:var(--card);border:3px solid var(--ink);border-radius:16px;
    box-shadow:5px 5px 0 var(--ink);padding:14px 10px;text-align:center;
  }
  .stat:nth-child(1){background:var(--yellow);transform:rotate(-1deg);}
  .stat:nth-child(2){background:var(--pink);transform:rotate(1deg);}
  .stat:nth-child(3){background:var(--teal);transform:rotate(-1deg);}
  .stat .num{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.45rem;line-height:1.15;}
  .stat .lab{font-size:.74rem;font-weight:700;opacity:.75;margin-top:2px;}

  /* ---------- 搜索栏 ---------- */
  .search-bar{
    position:relative;display:flex;align-items:center;margin-bottom:12px;
    background:var(--card);border:3px solid var(--ink);border-radius:999px;
    box-shadow:4px 4px 0 var(--ink);overflow:hidden;
  }
  .search-bar .si{font-size:1rem;padding:2px 10px;opacity:.5;}
  .search-input{
    flex:1;border:0;outline:0;background:transparent;font-size:.95rem;padding:11px 4px;color:var(--ink);font-family:inherit;
  }
  .search-clear{border:0;background:transparent;font-size:1.05rem;padding:0 14px;color:var(--ink);opacity:.5;cursor:pointer;}

  /* ---------- 筛选 ---------- */
  .filter-bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-item{
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:13.5px;color:var(--ink);cursor:pointer;
    border:2.5px solid var(--ink);border-radius:999px;padding:6px 17px;background:var(--card);
    box-shadow:3px 3px 0 var(--ink);
  }
  .filter-item.active{background:var(--yellow);}

  /* ---------- 库存列表（小程序同款：进度条卡片） ---------- */
  .inv-list{display:flex;flex-direction:column;gap:13px;}
  .inv-item{
    background:var(--card);border:3px solid var(--ink);border-radius:16px;
    box-shadow:5px 5px 0 var(--ink);padding:14px 16px 13px;cursor:pointer;
    transition:transform .12s,box-shadow .12s;
  }
  .inv-item:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .item-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .item-type{
    font-family:'Fredoka',sans-serif;font-size:.74rem;font-weight:700;color:var(--ink);
    border:2px solid var(--ink);border-radius:999px;padding:1px 10px;flex:0 0 auto;
  }
  .type-scroll{background:var(--teal);}
  .type-knife{background:var(--blue);}
  .type-tp{background:var(--pink);}
  .item-name{font-weight:800;font-size:1rem;flex:1;min-width:0;}
  .item-id{font-size:.7rem;font-weight:600;opacity:.5;border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;font-family:ui-monospace,monospace;}
  .item-spec{font-size:.82rem;opacity:.6;margin-top:4px;}
  .item-progress{margin-top:10px;}
  .progress-bar{height:14px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;box-shadow:inset 1px 1px 0 rgba(23,23,26,.15);}
  .progress-fill{height:100%;background:var(--pink);border-radius:999px;transition:width .4s ease;}
  .progress-fill.warn{background:var(--yellow);}
  .progress-fill.low{background:#FF6B6B;}
  .progress-text{display:flex;justify-content:space-between;margin-top:4px;font-size:.8rem;font-weight:700;}
  .progress-text .tt{opacity:.5;}

  .empty-state{text-align:center;padding:60px 0;opacity:.6;}
  .empty-state .ei{font-size:2.4rem;display:block;margin-bottom:8px;}
  .empty-state .et{font-weight:800;font-size:1.05rem;}
  .empty-state .ed{font-size:.85rem;margin-top:4px;}

  /* ---------- 底部悬浮操作组（小程序同款 FAB） ---------- */
  .fab-group{
    position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 96px);
    display:flex;flex-direction:column;gap:12px;z-index:260;align-items:flex-end;
  }
  .fab{
    width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.6rem;color:var(--ink);
    box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;
  }
  .fab:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .fab-main{width:56px;height:56px;background:var(--pink);font-size:1.5rem;}
  .fab-sec{width:56px;height:56px;background:var(--yellow);font-size:1.5rem;}
  .fab-ter{width:56px;height:56px;background:var(--blue);font-size:1.5rem;}

  /* ---------- 底部操作面板（点条目弹出） ---------- */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:300;
    background:var(--paper);border-top:4px solid var(--ink);
    border-radius:20px 20px 0 0;box-shadow:0 -6px 0 rgba(23,23,26,.12);
    padding:18px 20px calc(env(safe-area-inset-bottom) + 20px);
    transform:translateY(105%);transition:transform .25s ease;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-mask{position:fixed;inset:0;background:rgba(23,23,26,.4);z-index:290;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-mask.open{opacity:1;pointer-events:auto;}
  .sheet-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.1rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .sheet-close{border:2px solid var(--ink);background:var(--card);border-radius:10px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;}
  .sheet-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .sheet-label{flex:0 0 auto;align-self:center;font-size:.85rem;font-weight:700;opacity:.7;}
  .sheet-actions{display:flex;flex-direction:column;gap:10px;}
  .sheet-btn{
    border:3px solid var(--ink);border-radius:14px;background:var(--card);
    box-shadow:4px 4px 0 var(--ink);padding:13px 16px;font-size:1rem;font-weight:700;
    display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink);
  }
  .sheet-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .sheet-btn .ic{font-size:1.2rem;}
  .sheet-btn.consume{background:var(--yellow);}
  .sheet-btn.del{background:#FFE3E3;}
  .num-input{
    flex:1;min-width:90px;border:2.5px solid var(--ink);border-radius:10px;background:var(--card);
    padding:9px 12px;font-size:1.05rem;text-align:center;color:var(--ink);font-family:inherit;box-shadow:2px 2px 0 var(--ink);
  }
  .add-form{
    background:var(--yellow);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);
    padding:16px;margin-bottom:6px;
  }
  .add-form h4{font-family:'Fredoka',sans-serif;font-size:.98rem;margin-bottom:10px;}
  .add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px;}
  .add-row input,.add-row select{
    background:var(--card);border:2.5px solid var(--ink);color:var(--ink);border-radius:10px;
    padding:8px 10px;font-size:.9rem;font-family:inherit;box-shadow:2px 2px 0 var(--ink);
  }
  .add-row input.name{flex:1;min-width:130px;}
  .add-row input.num{width:78px;}

  .foot-note{text-align:center;margin-top:26px;font-size:.78rem;opacity:.55;}
</style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">Charlotte<b>.</b></a>
  <nav class="site-nav">
    <a href="index.html">首页</a>
    <a href="today.html">今日</a>
  </nav>
</header>

<main class="page">
  <div class="page-head">
    <h1 class="page-title">临池录<span class="dot">.</span></h1>
    <span class="sync-status" id="syncStatus">加载中…</span>
  </div>

  <!-- 统计卡 -->
  <div class="stats">
    <div class="stat"><div class="num" id="stTotal">0</div><div class="lab">库存种类</div></div>
    <div class="stat"><div class="num" id="stMeters">0</div><div class="lab">总米数</div></div>
    <div class="stat"><div class="num" id="stRemain">0</div><div class="lab">剩余米数</div></div>
  </div>

  <!-- 搜索栏 -->
  <div class="search-bar">
    <span class="si">🔍</span>
    <input class="search-input" id="searchInput" placeholder="搜索库存名称..." autocomplete="off" />
    <button class="search-clear" id="btnClearSearch">✕</button>
  </div>

  <!-- 筛选 -->
  <div class="filter-bar" id="filterBar"></div>

  <!-- 库存列表 -->
  <div class="inv-list" id="list">
    <div class="empty-state"><span class="ei">📦</span><span class="et">加载中…</span></div>

  <p class="foot-note">点击任意库存可扣减 · 右下角添加新纸张</p>
</main>

<!-- 底部悬浮按钮组 -->
<div class="fab-group">
  <div class="fab fab-sec" id="btnExport" title="导出">📤</div>
  <div class="fab fab-ter" id="btnToken" title="令牌设置">🔑</div>
  <div class="fab fab-main" id="btnAdd" title="添加库存">+</div>
</div>

<!-- tabBar -->
<nav class="tabbar" style="position:fixed;left:0;right:0;bottom:0;z-index:250;display:flex;background:var(--paper);border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);">
  <a class="tab" href="shufa-calendar.html" style="flex:1;text-align:center;padding:10px 0 8px;color:var(--ink);text-decoration:none;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.72rem;"><span class="ic" style="display:block;font-size:1.3rem;margin-bottom:2px;">📅</span>首页</a>
  <a class="tab" href="shufa-record.html" style="flex:1;text-align:center;padding:10px 0 8px;color:var(--ink);text-decoration:none;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.72rem;"><span class="ic" style="display:block;font-size:1.3rem;margin-bottom:2px;">✍️</span>记录</a>
  <a class="tab active" href="shufa-inventory.html" style="flex:1;text-align:center;padding:10px 0 8px;color:var(--ink);text-decoration:none;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.72rem;background:var(--yellow);"><span class="ic" style="display:block;font-size:1.3rem;margin-bottom:2px;">📦</span>库存</a>
  <a class="tab" href="shufa-history.html" style="flex:1;text-align:center;padding:10px 0 8px;color:var(--ink);text-decoration:none;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.72rem;"><span class="ic" style="display:block;font-size:1.3rem;margin-bottom:2px;">🗂️</span>历史</a>
</nav>

<!-- 点条目弹出的操作面板 -->
<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-title"><span id="sheetName">—</span><button class="sheet-close" id="sheetClose">✕</button></div>
  <div class="sheet-row">
    <input class="num-input" id="editNum" type="number" min="0" step="0.5" />
    <span style="align-self:center;font-weight:700" id="editUnit">米</span>
  </div>
  <div class="sheet-row" id="perRow" style="display:none">

  <div class="sheet-actions">
    <button class="sheet-btn consume" id="btnConsume"><span class="ic">✍️</span><span id="btnConsumeText">写一张（扣减 1）</span></button>
    <button class="sheet-btn" id="btnSaveEdit"><span class="ic">💾</span>保存修改</button>
    <button class="sheet-btn del" id="btnDelete"><span class="ic">🗑️</span>删除此库存</button>
  </div>
</div>

<script src="js/shufa-data.js"></script>
<script src="js/shufa-store.js"></script>
<script>
(() => {
  const REPO = 'Charlottttttttttttte/personal-site';
  const PATH = 'data/shufa-inventory.json';
  const LS_DATA = 'shufa_inv_local';
  const LS_TOKEN = 'shufa_gh_token';
  const TYPE_LABEL = { '长卷': '长卷', '刀纸': '刀纸', '条屏': '条屏' };
  const TYPE_CLS = { '长卷': 'scroll', '刀纸': 'knife', '条屏': 'tp' };

  const $ = (id) => document.getElementById(id);
  const state = { data: [], filter: '全部', query: '', editing: null };

  // ---------- 工具 ----------
  function setStatus(msg, kind) {
    const el = $('syncStatus');
    el.textContent = msg;
    el.className = 'sync-status' + (kind ? ' ' + kind : '');
  }
  function isLong(i) { return i.type === '长卷'; }
  function totalOf(i) { return isLong(i) ? (i.meters ?? i.total ?? 0) : (i.qty ?? i.total ?? 0); }
  function remainOf(i) { return i.remaining ?? totalOf(i); }
  function unitOf(i) { return isLong(i) ? '米' : '张'; }

  // 规格 → 每张米数（如四尺对开=1.38、四尺四开=0.69），无映射返回 0
  function specToMeters(spec) {
    const s = String(spec || '').trim();
    const map = (window.SHUFA_DATA && SHUFA_DATA.SPEC_TO_METERS) || {};
    for (const k in map) {
      if (s.startsWith(k)) return map[k];
    }
    return 0;
  }
  function perSheetOf(i) {
    return i.perSheetMeters || specToMeters(i.spec) || 0;
  }

  // ---------- 数据加载（双通道+超时） ----------
  async function fetchWithTimeout(url, ms) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    try { return await fetch(url, { signal: ctrl.signal }); }
    finally { clearTimeout(t); }
  }
  async function loadFromSameSite() {
    const r = await fetchWithTimeout(PATH, 8000);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  }
  async function loadFromAPI() {
    const r = await fetchWithTimeout(`https://api.github.com/repos/${REPO}/contents/${PATH}`, 10000);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const meta = await r.json();
    const bin = atob(meta.content);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  async function load() {
    try {
      const draft = localStorage.getItem(LS_DATA);
      if (draft) {
        state.data = JSON.parse(draft).items || [];
        setStatus('本机草稿 · 未同步', 'ok');
      } else {
        let json = null;
        try { json = await loadFromSameSite(); }
        catch (e1) {
          try { json = await loadFromAPI(); setStatus('已通过 API 加载'); }
          catch (e2) { throw new Error(e1.message + ' / ' + e2.message); }
        }
        state.data = json.items || [];
        setStatus('✓ 已加载');
      }
    } catch (err) {
      setStatus('加载失败：' + err.message, 'err');
      $('list').innerHTML = `<div class="empty-state"><span class="ei">⚠️</span><span class="et">数据加载失败</span><span class="ed">请检查网络后刷新</span></div>`;
    }
    renderAll();
  }

  function saveDraft() {
    localStorage.setItem(LS_DATA, JSON.stringify({ updatedAt: new Date().toISOString().slice(0, 10), items: state.data }));
  }

  // ---------- 渲染 ----------
  function filtered() {
    let list = state.data;
    if (state.filter !== '全部') list = list.filter(i => i.type === state.filter);
    if (state.query) {
      const q = state.query.toLowerCase();
      list = list.filter(i => (i.name || '').toLowerCase().includes(q) || (i.id || '').toLowerCase().includes(q));
    }
    // 剩余量从低到高（快用完的排上面，同小程序）
    return list.slice().sort((a, b) => remainOf(a) - remainOf(b));
  }

  // 每条折算米数：长卷=米数；刀纸/条屏=张数×每张米数（规格可自动推算）
  function metersOf(i) {
    if (isLong(i)) return i.meters ?? i.total ?? 0;
    return (i.qty ?? i.total ?? 0) * perSheetOf(i);
  }
  function remainMetersOf(i) {
    if (isLong(i)) return i.remaining ?? i.meters ?? 0;
    return (i.remaining ?? i.qty ?? 0) * perSheetOf(i);
  }

  function renderStats() {
    const totalMeters = state.data.reduce((s, i) => s + metersOf(i), 0);
    const remainMeters = state.data.reduce((s, i) => s + remainMetersOf(i), 0);
    $('stTotal').textContent = state.data.length;
    $('stMeters').textContent = Math.round(totalMeters * 100) / 100;
    $('stRemain').textContent = Math.round(remainMeters * 100) / 100;
  }

  function renderFilters() {
    const counts = { '全部': state.data.length };
    for (const t of ['长卷', '刀纸', '条屏']) counts[t] = state.data.filter(i => i.type === t).length;
    $('filterBar').innerHTML = Object.entries(counts).map(([t, n]) =>
      `<div class="filter-item ${state.filter === t ? 'active' : ''}" data-t="${t}">${t} ${n}</div>`
    ).join('');
    document.querySelectorAll('.filter-item').forEach(el => {
      el.addEventListener('click', () => { state.filter = el.dataset.t; renderAll(); });
    });
  }

  function renderList() {
    const list = filtered();
    if (!list.length) {
      $('list').innerHTML = '<div class="empty-state"><span class="ei">📦</span><span class="et">暂无库存</span><span class="ed">点击右下角 + 添加纸张</span></div>';
      return;
    }
    $('list').innerHTML = list.map((i, idx) => {
      const total = totalOf(i), remain = remainOf(i);
      const pct = total > 0 ? Math.max(0, Math.round((remain / total) * 100)) : 0;
      const cls = TYPE_CLS[i.type] || 'knife';
      const barCls = pct <= 20 ? 'low' : (pct <= 50 ? 'warn' : '');
      const spec = i.spec || (isLong(i) ? `${i.meters || '?'}米` : '刀纸');
      return `
        <div class="inv-item" data-idx="${idx}">
          <div class="item-header">
            <span class="item-type type-${cls}">${i.type}</span>
            <span class="item-name">${i.name}</span>
            <span class="item-id">${i.id}</span>
          </div>
          <div class="item-spec">尺寸：${spec}${!isLong(i) && perSheetOf(i) ? ` · ${perSheetOf(i)}米/张` : ''}</div>
          <div class="item-progress">
            <div class="progress-bar"><div class="progress-fill ${barCls}" style="width:${pct}%"></div></div>
            <div class="progress-text">
              <span>剩余 ${remain}${unitOf(i)}</span>
              <span class="tt">/ 共 ${total}${unitOf(i)} · ${pct}%</span>
            </div>
          </div>
        </div>`;
    }).join('');
    document.querySelectorAll('.inv-item').forEach(el => {
      el.addEventListener('click', () => openSheet(parseInt(el.dataset.idx)));
    });
  }

  function renderAll() {
    renderStats();
    renderFilters();
    renderList();
  }

  // ---------- 底部操作面板 ----------
  function openSheet(idx) {
    const item = filtered()[idx];
    if (!item) return;
    state.editing = item;
    $('sheetName').textContent = item.name + '（' + item.type + '）';
    $('editNum').value = remainOf(item);
    $('editUnit').textContent = unitOf(item);
    // 非长卷显示"每张米数"编辑（规格可自动推算）
    $('perRow').style.display = isLong(item) ? 'none' : 'flex';
    $('editPer').value = perSheetOf(item) ? String(perSheetOf(item)) : '';
    $('btnConsumeText').textContent = `✍️ 写${isLong(item) ? '一米（扣减 1 米）' : '一张（扣减 1 张）'}`;
    $('sheet').classList.add('open');
    $('sheetMask').classList.add('open');
  }
  function closeSheet() {
    $('sheet').classList.remove('open');
    $('sheetMask').classList.remove('open');
    state.editing = null;
  }

  function consumeOne() {
    const item = state.editing;
    if (!item) return;
    if (isLong(item)) {
      item.remaining = Math.max(0, remainOf(item) - 1);
    } else {
      item.remaining = Math.max(0, remainOf(item) - 1);
    }
    item.lastConsumedAt = new Date().toISOString(); // 供记录页"最近消耗在前"排序
    saveDraft();
    closeSheet();
    renderAll();
    setStatus('已扣减 1' + unitOf(item) + '（草稿）· 点 🔄 同步', 'ok');
  }

  function saveEdit() {
    const item = state.editing;
    if (!item) return;
    const v = parseFloat($('editNum').value);
    const max = totalOf(item);
    const n = isNaN(v) ? 0 : Math.max(0, Math.min(v, max));
    item.remaining = Math.round(n * (isLong(item) ? 1 : 1));
    if (isLong(item)) item.remaining = n;
    // 非长卷可同步维护每张米数
    if (!isLong(item)) {
      const per = parseFloat($('editPer').value);
      item.perSheetMeters = isNaN(per) || per < 0 ? 0 : per;
    }
    saveDraft();
    closeSheet();
    renderAll();
    setStatus('已保存（草稿）· 点 🔄 同步', 'ok');
  }

  function deleteItem() {
    const item = state.editing;
    if (!item) return;
    if (!confirm(`删除「${item.name}」？`)) return;
    state.data = state.data.filter(x => x !== item);
    saveDraft();
    closeSheet();
    renderAll();
    setStatus('已删除（草稿）· 点 🔄 同步', 'ok');
  }

  // ---------- 新增 ----------
  function showAddForm() {
    const name = prompt('纸张名称（如：新购宣纸）：');
    if (!name) return;
    const type = prompt('类型（长卷 / 刀纸 / 条屏）：', '刀纸');
    const t = (type || '').trim();
    if (!['长卷', '刀纸', '条屏'].includes(t)) { alert('类型无效'); return; }
    const maxNum = state.data.reduce((m, i) => {
      const m2 = /库存-(\d+)/.exec(i.id || '');
      const n = m2 ? parseInt(m2[1]) : 0;
      return Math.max(m, isNaN(n) ? 0 : n);
    }, 0);
    const isL = t === '长卷';
    const qRaw = prompt(isL ? '米数：' : '张数：', isL ? '' : '50');
    const q = qRaw ? parseFloat(qRaw) : null;
    const spec = prompt('尺寸规格（如：四尺对开）：', '');
    let perSheet = 0;
    if (!isL) {
      perSheet = specToMeters(spec); // 规格可自动推算（四尺对开=1.38、四尺四开=0.69）
      if (!perSheet) {
        const perRaw = prompt('每张米数（留空为 0，之后可在库存里补）：', '');
        const pv = perRaw ? parseFloat(perRaw) : NaN;
        perSheet = isNaN(pv) || pv < 0 ? 0 : pv;
      }
    }
    const item = {
      id: '库存-' + (maxNum + 1),
      type: t,
      name,
      qty: isL ? 1 : (q || 0),
      meters: isL ? q : null,
      spec: spec || '',
      total: q || 0,
      remaining: q || 0,
      perSheetMeters: perSheet,
    };
    state.data.unshift(item);
    saveDraft();
    renderAll();
    setStatus('已添加（草稿）· 点 🔄 同步', 'ok');
  }

  // ---------- 同步 ----------
  function getToken() { return localStorage.getItem(LS_TOKEN) || ''; }
  function setToken() {
    const cur = getToken();
    const val = prompt(cur ? '当前令牌已设置，输入新令牌替换（留空取消）：' : '请输入 GitHub 令牌：', '');
    if (val === null) return;
    const t = val.trim();
    if (t) { localStorage.setItem(LS_TOKEN, t); setStatus('令牌已保存', 'ok'); }
  }
  function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  }

  // 同步统一在首页「一键同步」完成（syncAll：记录+库存），此处不再单独同步

  // ---------- 导出 CSV ----------
  function exportCSV() {
    if (!state.data.length) { alert('没有可导出的库存'); return; }
    const headers = ['名称', '类型', '纸张ID', '总量', '单位', '剩余', '每张米数', '尺寸规格'];
    const rows = state.data.map(i => {
      const isLong = i.type === '长卷';
      const total = isLong ? (i.meters ?? i.total ?? 0) : (i.qty ?? i.total ?? 0);
      const remain = i.remaining ?? total;
      const unit = isLong ? '米' : '张';
      return [i.name, i.type, i.id, total, unit, remain, i.perSheetMeters || '', i.spec || ''];
    });
    const csv = '\uFEFF' + [headers, ...rows].map(row =>
      row.map(v => String(v).replace(/"/g, '""')).map(v => /[",\n]/.test(v) ? '"' + v + '"' : v).join(',')
    ).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '临池录_库存_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setStatus('已导出 CSV', 'ok');
  }

  // ---------- 事件 ----------
  $('btnToken').addEventListener('click', setToken);
  $('btnExport').addEventListener('click', exportCSV);
  $('btnAdd').addEventListener('click', showAddForm);
  $('btnClearSearch').addEventListener('click', () => { $('searchInput').value = ''; state.query = ''; renderAll(); });
  $('searchInput').addEventListener('input', e => { state.query = e.target.value.trim(); renderList(); });
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheetMask').addEventListener('click', closeSheet);
  $('btnConsume').addEventListener('click', consumeOne);
  $('btnSaveEdit').addEventListener('click', saveEdit);
  $('btnDelete').addEventListener('click', deleteItem);

  load();
})();
</script>
</body>
</html>
