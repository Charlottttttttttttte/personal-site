<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF9F0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>今日学习 · Charlotte</title>
<style>
  :root{
    --paper:#FFF9F0; --card:#FFFFFF; --ink:#17171A;
    --pink:#FF87AB; --yellow:#FFD23F; --blue:#6FB1FF; --teal:#4ECDC4; --leaf:#7FB77E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--paper);background-image:radial-gradient(rgba(23,23,26,.14) 2px,transparent 2.2px);background-size:34px 34px;color:var(--ink);font-family:'Noto Sans SC',sans-serif;overscroll-behavior:auto;-webkit-overflow-scrolling:touch;}
  html{height:auto;}
  body{min-height:100vh;position:relative;}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 32px);}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .date{font-size:14px;color:var(--ink);opacity:.6;font-weight:600;}
  .brand{font-family:'Fredoka',sans-serif;font-size:15px;font-weight:700;}
  h1{font-family:'Fredoka',sans-serif;font-size:34px;font-weight:700;margin-bottom:4px;line-height:1.2;}
  h1 .dot{color:var(--pink);}
  .sub{font-size:14px;color:var(--ink);opacity:.6;margin-bottom:22px;}
  .card{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:20px 18px 16px;margin-bottom:18px;cursor:pointer;position:relative;overflow:hidden;display:block;text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease;}
  .card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink);}
  .card::after{content:'';position:absolute;top:-18px;right:-18px;width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);}
  .card--fin::after{background:var(--yellow);}
  .card--agent::after{background:var(--blue);}
  .tag{display:inline-block;font-family:'Fredoka',sans-serif;font-weight:700;font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;margin-bottom:10px;}
  .card--fin .tag{background:var(--pink);}
  .card--agent .tag{background:var(--blue);}
  .ctitle{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:700;margin-bottom:6px;}
  .cdesc{font-size:14px;line-height:1.6;opacity:.7;}
  .cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:11px;border-top:3px solid var(--ink);font-family:'Fredoka',sans-serif;font-size:12px;font-weight:600;}
  .carrow{font-size:18px;}
  .done{opacity:.55;}
  .done .tag{background:#D9D9D9;}
  .done .ctitle{text-decoration:line-through;}
  .hint{margin-top:6px;font-size:12px;color:var(--ink);opacity:.5;text-align:center;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="brand">CHARLOTTE<span style="color:var(--pink)">.</span></span><span class="date" id="date"></span></header>
  <h1>今日学习<span class="dot">.</span></h1>
  <p class="sub" id="sub">每天打开，学今天该学的两门课。</p>

  <a class="card card--fin" id="finCard">
    <span class="tag" id="finTag">📈 财经</span>
    <div class="ctitle" id="finTitle">—</div>
    <p class="cdesc" id="finDesc"></p>
    <div class="cfoot"><span id="finFoot">FINANCE</span><span class="carrow">→</span></div>
  </a>

  <a class="card card--agent" id="agentCard">
    <span class="tag" id="agentTag">🤖 Agent</span>
    <div class="ctitle" id="agentTitle">—</div>
    <p class="cdesc" id="agentDesc"></p>
    <div class="cfoot"><span id="agentFoot">LEARNING PROJECT</span><span class="carrow">→</span></div>
  </a>

  <p class="hint">每天 +1 天自动推进 · 点卡片开始学习</p>
</div>

/* ===== 计算今天 ===== */
function dayDiff(fromISO, toISO){
  const a=new Date(fromISO+'T00:00:00'), b=new Date(toISO+'T00:00:00');
  return Math.round((b-a)/86400000);
}
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function cur(d){ return Math.min(d,28); }

(function init(){
  const t=todayISO();
  const diff=dayDiff(FIN_ANCHOR_DATE,t);
  const finDay=cur(FIN_ANCHOR_DAY+diff);
  const agtDay=cur(AGT_ANCHOR_DAY+diff);

  document.getElementById('date').textContent=t;
  const f=FIN[finDay-1], a=AGT[agtDay-1];

  const finCard=document.getElementById('finCard');
  finCard.href=f.url;
  document.getElementById('finTag').textContent='📈 财经 · D'+finDay;
  document.getElementById('finTitle').textContent=f.t;
  document.getElementById('finDesc').textContent=f.d;
  document.getElementById('finFoot').textContent='FINANCE · '+finDay+'/28';

  const agtCard=document.getElementById('agentCard');
  agtCard.href=a.url;
  document.getElementById('agentTag').textContent='🤖 Agent · D'+agtDay;
  document.getElementById('agentTitle').textContent=a.t;
  document.getElementById('agentDesc').textContent=a.d;
  document.getElementById('agentFoot').textContent='LEARNING · '+agtDay+'/28';

  document.getElementById('sub').textContent='8/10 起财经 D15、Agent D1，每天 +1 推进。';
})();
