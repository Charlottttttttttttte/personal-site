<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#FFF9F0" />
<title>临池录 · 记录练习 · Charlotte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --paper:#FFF9F0; --card:#FFFFFF; --ink:#17171A;
    --pink:#FF87AB; --yellow:#FFD23F; --blue:#6FB1FF; --teal:#4ECDC4; --leaf:#7FB77E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    background:var(--paper);
    background-image:radial-gradient(rgba(23,23,26,.14) 2px,transparent 2.2px);
    background-size:34px 34px;
    color:var(--ink);font-family:'Noto Sans SC',sans-serif;
    overscroll-behavior:auto;-webkit-overflow-scrolling:touch;
  }
  body{min-height:100vh;padding-bottom:100px;}
  .fun{font-family:'Fredoka',sans-serif;font-variant-numeric:tabular-nums;}

  .page{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 30px) 5vw 30px;}
  .page-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .page-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.6rem,5vw,2rem);}
  .page-title .dot{color:var(--pink);}
  .date-row{display:flex;gap:8px;align-items:center;margin-bottom:16px;}
  .date-input{border:2.5px solid var(--ink);border-radius:10px;background:var(--card);padding:8px 12px;font-size:.95rem;font-family:inherit;box-shadow:2px 2px 0 var(--ink);color:var(--ink);}
  .type-toggle{display:flex;gap:8px;}
  .type-btn{border:2.5px solid var(--ink);border-radius:999px;padding:7px 18px;font-weight:700;cursor:pointer;background:var(--card);box-shadow:2px 2px 0 var(--ink);font-size:.9rem;}
  .type-btn.active{background:var(--pink);}
  .type-btn.scroll.active{background:var(--teal);}

  .card{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:16px;margin-bottom:18px;}
  .sec-title{font-family:'Fredoka',sans-serif;font-weight:700;font-size:.95rem;margin-bottom:12px;letter-spacing:.05em;}
  .hint{font-size:.8rem;opacity:.6;margin-bottom:10px;}
  textarea.quick-textarea{width:100%;border:2.5px solid var(--ink);border-radius:12px;background:var(--card);padding:12px;font-size:.95rem;font-family:inherit;color:var(--ink);box-shadow:2px 2px 0 var(--ink);min-height:80px;resize:vertical;}
  .parse-btn{border:3px solid var(--ink);border-radius:12px;background:var(--blue);padding:10px;text-align:center;font-weight:700;cursor:pointer;margin-top:10px;box-shadow:3px 3px 0 var(--ink);}
  .parse-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .parse-preview{margin-top:12px;border:2.5px dashed var(--ink);border-radius:12px;padding:12px;background:var(--paper);}
  .parse-row{display:flex;justify-content:space-between;font-size:.88rem;padding:3px 0;border-bottom:1px solid rgba(23,23,26,.08);}
  .parse-row .lab{opacity:.6;}
  .parse-row.highlight{font-weight:800;}
  .parse-row.highlight .val{color:#2E7D5B;}
  .conf{font-size:.75rem;opacity:.6;margin-top:6px;text-align:right;}

  .form-row{display:flex;align-items:center;margin-bottom:12px;gap:10px;}
  .form-label{width:56px;flex:0 0 auto;font-size:.88rem;font-weight:700;opacity:.75;}
  .form-value{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .picker{border:2.5px solid var(--ink);border-radius:10px;background:var(--card);padding:9px 12px;font-size:.92rem;font-weight:600;cursor:pointer;box-shadow:2px 2px 0 var(--ink);flex:1;text-align:center;}
  .picker.placeholder{opacity:.5;font-weight:400;}
  .num-input{border:2.5px solid var(--ink);border-radius:10px;background:var(--card);padding:9px 12px;font-size:1rem;width:90px;text-align:center;box-shadow:2px 2px 0 var(--ink);color:var(--ink);font-family:inherit;}
  .meters-preview{font-size:.9rem;font-weight:800;color:#2E7D5B;margin:4px 0 10px 66px;}
  .inv-hint{font-size:.78rem;color:#C2543C;font-weight:600;margin:-4px 0 8px 66px;}

  .save-btn{border:3px solid var(--ink);border-radius:999px;background:var(--yellow);padding:15px;text-align:center;font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:5px 5px 0 var(--ink);margin-top:6px;}
  .save-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}

  /* tabBar */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;background:var(--paper);border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom);}
  .tab{flex:1;text-align:center;padding:10px 0 8px;color:var(--ink);text-decoration:none;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.72rem;}
  .tab .ic{display:block;font-size:1.3rem;margin-bottom:2px;}
  .tab.active{background:var(--yellow);}
</style>
</head>
<body>

<main class="page">
  <div class="page-head">
    <h1 class="page-title">记录练习<span class="dot">.</span></h1>
    <span class="sync-status" id="syncStatus" style="font-size:.78rem;opacity:.75">—</span>
  </div>

  <div class="date-row">
    <input class="date-input" type="date" id="dateInput" />
    <div class="type-toggle">
      <button class="type-btn sheet" id="btnSheet">📄 单张</button>
      <button class="type-btn scroll" id="btnScroll">📜 长卷</button>
    </div>
  </div>

  <!-- 快速输入 -->
  <div class="card">
    <div class="sec-title">快速输入</div>
    <div class="hint">例如：「今天写了3张四尺对开，九成宫，楷书」</div>
    <textarea class="quick-textarea" id="quickText" placeholder="描述今天写了什么…"></textarea>
    <div class="parse-btn" id="btnParse">⚡ 智能识别</div>
    <div class="parse-preview" id="parsePreview" style="display:none"></div>
  </div>

  <!-- 手动表单 -->
  <div class="card">
    <div class="sec-title">手动填写</div>
    <div class="form-row">
      <span class="form-label">数量</span>
      <div class="form-value">
        <input class="num-input" id="fQty" type="number" min="0" step="0.5" placeholder="0" />
        <span id="qtyUnit" style="font-weight:700">张</span>
      </div>
    </div>
    <div class="form-row">
      <span class="form-label">纸型</span>
      <div class="form-value">
        <select class="picker" id="fPaper">
          <option value="">— 选择纸型 —</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <span class="form-label">📦 库存</span>
      <div class="form-value">
        <select class="picker" id="fInventory">
          <option value="">不使用库存</option>
        </select>
      </div>
    </div>
    <div class="meters-preview" id="metersPreview"></div>
    <div class="inv-hint" id="invHint"></div>
    <div class="form-row">
      <span class="form-label">字体</span>
      <div class="form-value">
        <select class="picker" id="fFont">
          <option value="">— 选择字体 —</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <span class="form-label">字帖</span>
      <div class="form-value">
        <select class="picker" id="fCopybook">
          <option value="">— 选择字帖（选填）—</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <span class="form-label">备注</span>
      <div class="form-value">
        <input class="date-input" style="flex:1;width:auto" id="fNote" placeholder="可选：心得、问题等" />
      </div>
    </div>
  </div>

  <div class="save-btn" id="btnSave">记录练习</div>
  <div style="text-align:center;font-size:.76rem;opacity:.55;margin-top:10px;">已保存到本机 · 回首页点「🔄 一键同步」发布</div>
</main>

<nav class="tabbar">
  <a class="tab" href="shufa-calendar.html"><span class="ic">📅</span>首页</a>
  <a class="tab active" href="shufa-record.html"><span class="ic">✍️</span>记录</a>
  <a class="tab" href="shufa-inventory.html"><span class="ic">📦</span>库存</a>
  <a class="tab" href="shufa-history.html"><span class="ic">🗂️</span>历史</a>
</nav>

<script src="js/shufa-data.js"></script>
<script src="js/shufa-parser.js"></script>
<script src="js/shufa-store.js"></script>
<script>
(() => {
  const D = window.SHUFA_DATA;
  const P = window.SHUFA_PARSER;
  const $ = (id) => document.getElementById(id);
  const state = { type: 'sheet', records: [], inventory: [], editingId: null, selectedPaperId: null };

  function todayStr() {
    const n = new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  }
  function setStatus(m) { $('syncStatus').textContent = m; }

  // ---------- 初始化纸型/字体/字帖选项 ----------
  // 字帖下拉框（内置 + 本机自定义），selectedId 用于重建后回选
  function renderCopybookOptions(selectedId) {
    let cbHtml = '<option value="">— 选择字帖（选填）—</option>';
    for (const b of D.COPYBOOK_LIST) {
      cbHtml += `<option value="${b.copybookId}" data-font="${b.fontId}">${b.copybookName}（${b.authorName}）</option>`;
    }
    for (const b of SHUFA_STORE.getCustomCopybooks()) {
      cbHtml += `<option value="${b.copybookId}" data-font="${b.fontId}">${b.copybookName}（${b.authorName}）</option>`;
    }
    cbHtml += '<option value="__custom__">➕ 自定义字帖…</option>';
    $('fCopybook').innerHTML = cbHtml;
    if (selectedId) $('fCopybook').value = selectedId;
  }

  function initOptions() {
    // 纸型（标准纸型 + 长卷）
    let paperHtml = '<option value="">— 选择纸型 —</option>';
    for (const id in D.PAPER_TYPES) {
      const p = D.PAPER_TYPES[id];
      if (p.type === 'scroll') continue; // 长卷走"库存纸"或手动米数
      paperHtml += `<option value="${id}">${p.name}（${p.lengthPerSheet}米/张）</option>`;
    }
    $('fPaper').innerHTML = paperHtml;

    // 字体
    let fontHtml = '<option value="">— 选择字体 —</option>';
    for (const f of D.FONT_KEYWORDS) fontHtml += `<option value="${f}">${f}</option>`;
    $('fFont').innerHTML = fontHtml;

    // 字帖（内置 + 本机自定义）
    renderCopybookOptions('');
  }

  // ---------- 库存联动 ----------
  function initInventory() {
    let html = '<option value="">不使用库存</option>';
    for (const it of state.inventory) {
      const remain = it.remaining ?? (it.type === '长卷' ? it.meters : it.qty);
      const unit = it.type === '长卷' ? '米' : '张';
      html += `<option value="${it.id}">${it.name}（余${remain}${unit}）</option>`;
    }
    $('fInventory').innerHTML = html;
  }

  function onInventoryChange() {
    const id = $('fInventory').value;
    if (!id) { $('invHint').textContent = ''; return; }
    const it = state.inventory.find(x => x.id === id);
    if (!it) return;
    const remain = it.remaining ?? (it.type === '长卷' ? it.meters : it.qty);
    const unit = it.type === '长卷' ? '米' : '张';
    $('invHint').textContent = `将使用「${it.name}」，当前剩余 ${remain}${unit}，保存后自动扣减`;
    if (it.type === '长卷') {
      state.type = 'scroll';
      setTypeUI('scroll');
    } else {
      state.type = 'sheet';
      setTypeUI('sheet');
    }
  }

  function setTypeUI(t) {
    state.type = t;
    $('btnSheet').classList.toggle('active', t === 'sheet');
    $('btnScroll').classList.toggle('active', t === 'scroll');
    $('qtyUnit').textContent = t === 'scroll' ? '米' : '张';
    $('fQty').placeholder = t === 'scroll' ? '写了多少米' : '写了几张';
  }

  // ---------- 米数计算 ----------
  function calcMeters() {
    const qty = parseFloat($('fQty').value) || 0;
    let meters = 0;
    if (state.type === 'scroll') {
      meters = qty; // 长卷：数量就是米数
    } else {
      const paperId = $('fPaper').value;
      const invId = $('fInventory').value;
      let per = 0;
      if (invId) {
        const it = state.inventory.find(x => x.id === invId);
        per = it && it.perSheetMeters ? it.perSheetMeters : 0;
      } else if (paperId) {
        per = D.PAPER_TYPES[paperId].lengthPerSheet || 0;
      }
      meters = qty * per;
    }
    $('metersPreview').textContent = meters > 0 ? `预计：${meters.toFixed(2)} 米` : '';
    return meters;
  }

  // ---------- 智能识别 ----------
  function parseAndFill() {
    const text = $('quickText').value.trim();
    if (!text) { alert('请先输入文字'); return; }
    const r = P.parseInput(text);
    if (r.confidence === 0) {
      alert('未能识别内容，请检查输入或手动填写');
      return;
    }
    // 填表
    if (r.paper) {
      const pid = r.paper.id;
      if (D.PAPER_TYPES[pid] && D.PAPER_TYPES[pid].type === 'scroll') {
        setTypeUI('scroll');
      } else {
        setTypeUI('sheet');
        $('fPaper').value = pid;
      }
    } else if (r.quantity && r.quantity.unit === '米') {
      setTypeUI('scroll');
    } else {
      setTypeUI('sheet');
    }
    if (r.quantity) $('fQty').value = r.quantity.number;
    if (r.font) $('fFont').value = r.font.font;
    if (r.copybook) $('fCopybook').value = r.copybook.id;
    // 预览
    const rows = [
      ['纸型', r.paper ? r.paper.name : '未识别'],
      ['数量', r.quantity ? r.quantity.raw : '未识别'],
      ['字帖', r.copybook ? r.copybook.name : '未识别'],
      ['字体', r.font ? r.font.font : '未识别'],
      ['预计米数', (r.meters || 0).toFixed(2) + ' 米']
    ];
    const confText = r.confidence >= 0.7 ? '较高' : '较低（建议手动确认）';
    $('parsePreview').innerHTML = rows.map(([l, v]) =>
      `<div class="parse-row"><span class="lab">${l}：</span><span>${v}</span></div>`
    ).join('') + `<div class="conf">识别置信度：${confText}</div>`;
    $('parsePreview').style.display = '';
    calcMeters();
  }

  // ---------- 保存 ----------
  function save() {
    const ok = saveLocal();
    if (ok) setTimeout(() => location.href = 'shufa-calendar.html', 500);
  }

  function saveLocal() {
    const date = $('dateInput').value || todayStr();
    const qtyNum = parseFloat($('fQty').value) || 0;
    if (qtyNum <= 0) { alert('请填写数量'); return false; }
    const meters = calcMeters();

    // 纸型 snapshot
    const invId = $('fInventory').value;
    let paperSnapshot = null;
    if (invId) {
      const it = state.inventory.find(x => x.id === invId);
      if (it) paperSnapshot = { id: it.id, name: it.name, inventoryId: it.id, lengthPerSheet: it.perSheetMeters || 0 };
    } else if ($('fPaper').value) {
      const p = D.PAPER_TYPES[$('fPaper').value];
      paperSnapshot = { id: p.id, name: p.name, lengthPerSheet: p.lengthPerSheet };
    }

    // 字帖 snapshot（内置 + 本机自定义）
    const cbSel = $('fCopybook').value;
    let copybookSnapshot = null;
    if (cbSel && cbSel !== '__custom__') {
      const b = D.COPYBOOK_LIST.find(x => x.copybookId === cbSel)
        || SHUFA_STORE.getCustomCopybooks().find(x => x.copybookId === cbSel);
      if (b) copybookSnapshot = { fontId: b.fontId || '', fontName: b.fontName || '', authorName: b.authorName, copybookName: b.copybookName };
    }

    const record = {
      id: state.editingId || ('rec_' + Date.now()),
      date,
      type: state.type,
      meters: +meters.toFixed(2),
      quantity: { number: qtyNum, unit: state.type === 'scroll' ? '米' : '张' },
      paperSnapshot,
      copybookSnapshot,
      note: $('fNote').value.trim(),
      createdAt: state.editingId ? undefined : new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      deleted: false
    };

    // 长卷：维护 progressLog + status + length
    if (state.type === 'scroll') {
      const existing = state.editingId ? state.records.find(r => r.id === state.editingId) : null;
      if (existing) {
        existing.length = (existing.length || 0) + qtyNum;
        existing.meters = existing.length;
        existing.progressLog = existing.progressLog || [];
        existing.progressLog.push({ addedAt: new Date().toISOString(), addedLength: qtyNum, totalLength: existing.length, note: record.note });
        existing.updatedAt = new Date().toISOString();
        existing.status = existing.status || 'ongoing';
      } else {
        record.length = qtyNum;
        record.status = 'ongoing';
        record.progressLog = [{ addedAt: new Date().toISOString(), addedLength: qtyNum, totalLength: qtyNum, note: record.note }];
        state.records.unshift(record);
      }
    } else {
      if (state.editingId) {
        const idx = state.records.findIndex(r => r.id === state.editingId);
        if (idx >= 0) state.records[idx] = { ...state.records[idx], ...record };
      } else {
        state.records.unshift(record);
      }
    }

    // 扣减库存
    if (invId) {
      const it = state.inventory.find(x => x.id === invId);
      if (it) {
        const unit = state.type === 'scroll' ? 1 : 1;
        it.remaining = Math.max(0, (it.remaining ?? (it.type === '长卷' ? it.meters : it.qty)) - qtyNum * unit);
        const invData = { updatedAt: new Date().toISOString().slice(0,10), items: state.inventory };
        SHUFA_STORE.saveDraft('inventory', invData);
      }
    }

    // 保存草稿
    const recData = { updatedAt: new Date().toISOString().slice(0,10), records: state.records };
    SHUFA_STORE.saveDraft('records', recData);
    setStatus('已保存草稿 · 点 🔄 同步发布');
    return true;
  }

  // ---------- 编辑加载 ----------
  function loadEditing(id) {
    const r = state.records.find(x => x.id === id);
    if (!r) return;
    state.editingId = id;
    $('dateInput').value = r.date;
    setTypeUI(r.type);
    $('fQty').value = r.quantity ? r.quantity.number : r.meters;
    if (r.paperSnapshot && r.paperSnapshot.inventoryId) {
      // 尽量回选库存
      initInventory();
      $('fInventory').value = r.paperSnapshot.inventoryId;
    } else if (r.paperSnapshot && D.PAPER_TYPES[r.paperSnapshot.id]) {
      $('fPaper').value = r.paperSnapshot.id;
    }
    if (r.copybookSnapshot) {
      const cbName = r.copybookSnapshot.copybookName;
      const b = D.COPYBOOK_LIST.find(x => x.copybookName === cbName);
      if (b) {
        $('fCopybook').value = b.copybookId;
      } else {
        const custom = SHUFA_STORE.getCustomCopybooks().find(x => x.copybookName === cbName);
        if (custom) {
          $('fCopybook').value = custom.copybookId;
        } else {
          // 老数据兜底：本地无该自定义字帖时临时补一个选项供回显
          const opt = document.createElement('option');
          opt.value = 'custom:' + cbName;
          opt.textContent = cbName + '（自定义）';
          const addOpt = $('fCopybook').querySelector('option[value="__custom__"]');
          $('fCopybook').insertBefore(opt, addOpt);
          $('fCopybook').value = opt.value;
        }
      }
    }
    $('fNote').value = r.note || '';
    $('btnSave').textContent = '保存修改';
    calcMeters();
  }

  // ---------- 启动 ----------
  initOptions();
  setTypeUI('sheet');
  $('dateInput').value = todayStr();

  $('btnParse').addEventListener('click', parseAndFill);
  $('btnSave').addEventListener('click', save);
  $('btnSheet').addEventListener('click', () => setTypeUI('sheet'));
  $('btnScroll').addEventListener('click', () => setTypeUI('scroll'));
  $('fPaper').addEventListener('change', calcMeters);
  $('fInventory').addEventListener('change', () => { onInventoryChange(); calcMeters(); });
  $('fQty').addEventListener('input', calcMeters);
  $('fCopybook').addEventListener('change', () => {
    if ($('fCopybook').value === '__custom__') {
      const name = prompt('输入自定义字帖名称：');
      if (name && name.trim()) {
        // 持久化到本机，下次打开页面仍可选择
        const fontSel = $('fFont').value;
        const entry = SHUFA_STORE.addCustomCopybook(name, fontSel, fontSel);
        renderCopybookOptions(entry.copybookId);
      } else {
        $('fCopybook').value = '';
      }
    }
  });

  (async () => {
    try {
      const qs = new URLSearchParams(location.search);
      const [recR, invR] = await Promise.all([
        SHUFA_STORE.load('records'),
        SHUFA_STORE.load('inventory')
      ]);
      state.records = recR.data.records || [];
      state.inventory = invR.data.items || [];
      initInventory();
      if (qs.get('editId')) loadEditing(qs.get('editId'));
      else if (qs.get('type')) setTypeUI(qs.get('type'));
      if (qs.get('date')) $('dateInput').value = qs.get('date');
    } catch (err) {
      setStatus('加载失败：' + err.message);
    }
    // 后台静默合并线上自定义字帖（新设备首次打开即可用；失败忽略）
    SHUFA_STORE.pullCustomCopybooks().then(() => {
      if ($('fCopybook').value !== '__custom__') renderCopybookOptions($('fCopybook').value);
    }).catch(() => {});
  })();
})();
</script>
</body>
